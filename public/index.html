<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мессенджер Храма</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { display: flex; height: 100vh; background: #0f0f13; color: #e1e1e6; overflow: hidden; }

    /* Боковая панель Храма */
    #sidebar { width: 340px; background: #16161e; border-right: 1px solid #282836; display: flex; flex-direction: column; }
    .header-panel { padding: 15px; background: #1a1a24; border-bottom: 1px solid #282836; text-align: center; font-weight: bold; font-size: 1.1em; color: #7aa2f7; }
    
    .profile-card { padding: 15px; border-bottom: 1px solid #282836; background: #13131a; }
    .profile-card label { font-size: 0.8em; color: #a9b1d6; margin-top: 5px; display: block; }
    .profile-card input { width: 100%; padding: 8px 10px; margin-top: 3px; background: #1f1f2e; color: #fff; border: 1px solid #3b4261; border-radius: 6px; outline: none; }
    .profile-card input:focus { border-color: #7aa2f7; }

    .btn-action { padding: 9px 14px; background: #7aa2f7; color: #15161e; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; transition: 0.2s; }
    .btn-action:hover { background: #89ddff; }
    .btn-secondary { background: #24283b; color: #c0caf5; margin-top: 5px; }
    .btn-secondary:hover { background: #414868; }

    .chat-list { flex: 1; overflow-y: auto; }
    .chat-item { padding: 14px; border-bottom: 1px solid #1f1f2e; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: 0.15s; }
    .chat-item:hover { background: #1f1f2e; }
    .chat-item.active { background: #283457; border-left: 4px solid #7aa2f7; }
    .chat-item .avatar { width: 40px; height: 40px; border-radius: 50%; background: #3b4261; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 10px; }
    .chat-info { flex: 1; overflow: hidden; }
    .chat-name { font-weight: bold; font-size: 0.95em; color: #c0caf5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Главная область общения */
    #chat-area { flex: 1; display: flex; flex-direction: column; background: #0f0f13; position: relative; background-size: cover; background-position: center; }
    .chat-header { padding: 12px 20px; background: #16161e; border-bottom: 1px solid #282836; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
    .chat-title-container { display: flex; align-items: center; gap: 10px; }

    .messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; z-index: 5; }
    
    .msg-bubble { max-width: 65%; padding: 10px 14px; border-radius: 12px; background: #1a1a24; border: 1px solid #282836; word-wrap: break-word; color: #c0caf5; position: relative; }
    .msg-bubble.my-msg { align-self: flex-end; background: #3b4261; border-color: #7aa2f7; color: #fff; }
    .msg-sender { font-size: 0.75em; font-weight: bold; color: #7aa2f7; margin-bottom: 4px; }
    .msg-time { font-size: 0.65em; color: #565f89; text-align: right; margin-top: 4px; }
    .msg-bubble img, .msg-bubble video { max-width: 100%; border-radius: 8px; margin-top: 6px; }

    .chat-input-bar { padding: 15px; background: #16161e; border-top: 1px solid #282836; display: flex; gap: 10px; align-items: center; z-index: 10; }
    .chat-input-bar input[type="text"] { flex: 1; padding: 12px; background: #1f1f2e; color: #fff; border: 1px solid #3b4261; border-radius: 8px; outline: none; }
    .chat-input-bar input[type="text"]:focus { border-color: #7aa2f7; }

    /* Окно аудио/видео вызовов */
    #call-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15,15,19,0.92); backdrop-filter: blur(8px); justify-content: center; align-items: center; flex-direction: column; z-index: 2000; }
    .video-grid { display: flex; gap: 20px; margin-bottom: 25px; flex-wrap: wrap; justify-content: center; }
    video { width: 320px; height: 240px; background: #000; border-radius: 12px; border: 2px solid #3b4261; object-fit: cover; }
    .call-controls { display: flex; gap: 15px; }

    .call-btn { padding: 12px 24px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; color: #fff; }
    .btn-accept { background: #9ece6a; color: #15161e; }
    .btn-decline { background: #f7768e; }
  </style>
</head>
<body>

  <!-- Боковая панель -->
  <div id="sidebar">
    <div class="header-panel">⛪ Мессенджер Храма</div>
    
    <div class="profile-card">
      <label>Ваше имя в Храме</label>
      <input type="text" id="username-input" placeholder="Имя">
      <label>Номер телефона</label>
      <input type="text" id="phone-input" placeholder="Телефон">
      <button class="btn-action" onclick="saveProfile()">Сохранить профиль</button>
      <button class="btn-action btn-secondary" onclick="promptCreateGroup()">+ Создать новую группу</button>
    </div>

    <div class="chat-list" id="chat-list"></div>
  </div>

  <!-- Область чата -->
  <div id="chat-area">
    <div class="chat-header">
      <div class="chat-title-container">
        <h3 id="current-chat-title">Выберите диалог</h3>
      </div>
      <div style="display: flex; gap: 10px;">
        <label class="btn-action btn-secondary" style="margin: 0; padding: 8px 12px; cursor: pointer;">
          🖼️ Фон чата
          <input type="file" id="bg-file-input" accept="image/*" style="display:none;" onchange="uploadChatBg(event)">
        </label>
        <button class="btn-action" style="margin: 0; padding: 8px 16px;" onclick="initiateCall()">📞 Звонок</button>
      </div>
    </div>

    <div class="messages-container" id="messages-container"></div>

    <div class="chat-input-bar">
      <input type="file" id="attach-file-input" style="display:none;" onchange="uploadAndSendFile(event)">
      <button class="btn-action btn-secondary" style="width: auto; margin: 0; padding: 12px 15px;" onclick="document.getElementById('attach-file-input').click()">📎</button>
      <input type="text" id="msg-input" placeholder="Напишите сообщение в Храм..." onkeypress="if(event.key==='Enter') sendChatMessage()">
      <button class="btn-action" style="width: auto; margin: 0; padding: 12px 20px;" onclick="sendChatMessage()">Отправить</button>
    </div>
  </div>

  <!-- Модальное окно вызовов -->
  <div id="call-modal">
    <h2 id="call-status-text" style="color: #7aa2f7; margin-bottom: 20px;">Установление связи...</h2>
    <div class="video-grid">
      <video id="local-video" autoplay muted></video>
      <video id="remote-video" autoplay></video>
    </div>
    <div class="call-controls">
      <button class="call-btn btn-accept" id="accept-call-btn" style="display: none;" onclick="acceptIncomingCall()">Ответить</button>
      <button class="call-btn btn-decline" onclick="hangUpCall()">Завершить</button>
    </div>
  </div>

  <script>
    // Подключение к серверу Храма
    const socket = io();

    let userUid = localStorage.getItem('khram_uid') || 'uid-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5);
    localStorage.setItem('khram_uid', userUid);

    let activeChatId = 'bot-assistant';
    let isGroupChat = false;

    // Рингтон вызова Храма
    const callRingtone = new Audio('https://actions.google.com/sounds/v1/ringtones/incoming_call.ogg');
    callRingtone.loop = true;

    // Конфигурация WebRTC STUN
    const rtcConfiguration = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' }
      ]
    };
    let peerConn = null;
    let localMediaStream = null;
    let pendingCallData = null;

    function saveProfile() {
      const uName = document.getElementById('username-input').value || 'Путник';
      const uPhone = document.getElementById('phone-input').value || '';
      socket.emit('register', { uid: userUid, username: uName, phone: uPhone });
    }

    socket.on('connect', () => {
      saveProfile();
    });

    socket.on('online-users-list', (onlineUids) => {
      refreshChatList(onlineUids);
    });

    function refreshChatList(onlineUids) {
      const listEl = document.getElementById('chat-list');
      listEl.innerHTML = `
        <div class="chat-item ${activeChatId === 'bot-assistant' ? 'active' : ''}" onclick="selectActiveChat('bot-assistant', false, 'ИИ Помощник 🤖')">
          <div class="avatar">🤖</div>
          <div class="chat-info">
            <div class="chat-name">ИИ Помощник Храма</div>
          </div>
        </div>
      `;

      onlineUids.forEach(id => {
        if (id !== userUid) {
          listEl.innerHTML += `
            <div class="chat-item ${activeChatId === id ? 'active' : ''}" onclick="selectActiveChat('${id}', false, 'Пользователь ${id.slice(-4)}')">
              <div class="avatar">👤</div>
              <div class="chat-info">
                <div class="chat-name">Пользователь (${id.slice(-4)})</div>
              </div>
            </div>
          `;
        }
      });
    }

    function selectActiveChat(id, isGroup, title) {
      activeChatId = id;
      isGroupChat = isGroup;
      document.getElementById('current-chat-title').innerText = title;
      document.getElementById('messages-container').innerHTML = '';
    }

    // Смена и синхронизация фона чата
    function uploadChatBg(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const bgData = evt.target.result;
        document.getElementById('chat-area').style.backgroundImage = `url(${bgData})`;

        if (isGroupChat) {
          socket.emit('update-group-bg', { groupId: activeChatId, bgImage: bgData, userUid: userUid });
        }
      };
      reader.readAsDataURL(file);
    }

    socket.on('group-bg-updated', ({ groupId, bgImage }) => {
      if (isGroupChat && activeChatId === groupId) {
        document.getElementById('chat-area').style.backgroundImage = `url(${bgImage})`;
      }
    });

    // Отправка текстовых сообщений
    function sendChatMessage() {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text) return;

      socket.emit('chat message', {
        senderUid: userUid,
        targetUid: activeChatId,
        isGroup: isGroupChat,
        type: 'text',
        content: text
      });
      input.value = '';
    }

    // Отправка файлов и медиа любого формата
    function uploadAndSendFile(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        let fileType = 'file';
        if (file.type.startsWith('image/')) fileType = 'image';
        if (file.type.startsWith('audio/')) fileType = 'audio';
        if (file.type.startsWith('video/')) fileType = 'video';

        socket.emit('chat message', {
          senderUid: userUid,
          targetUid: activeChatId,
          isGroup: isGroupChat,
          type: fileType,
          fileData: evt.target.result,
          fileName: file.name,
          fileSize: file.size
        });
      };
      reader.readAsDataURL(file);
    }

    // Отрисовка полученных сообщений
    socket.on('chat message', (msg) => {
      if ((msg.isGroup && msg.targetUid === activeChatId) ||
          (!msg.isGroup && (msg.senderUid === activeChatId || msg.senderUid === userUid))) {
        
        const container = document.getElementById('messages-container');
        const bubble = document.createElement('div');
        bubble.className = `msg-bubble ${msg.senderUid === userUid ? 'my-msg' : ''}`;

        let htmlContent = `<div class="msg-sender">${msg.senderName}</div>`;

        if (msg.type === 'text') {
          htmlContent += `<div>${msg.content}</div>`;
        } else if (msg.type === 'image') {
          htmlContent += `<img src="${msg.fileData}"><br><small>${msg.fileName}</small>`;
        } else if (msg.type === 'audio') {
          htmlContent += `<audio controls src="${msg.fileData}"></audio><br><small>${msg.fileName}</small>`;
        } else if (msg.type === 'video') {
          htmlContent += `<video controls src="${msg.fileData}"></video><br><small>${msg.fileName}</small>`;
        } else {
          htmlContent += `<a href="${msg.fileData}" download="${msg.fileName}" style="color:#7aa2f7;">💾 Скачать: ${msg.fileName}</a>`;
        }

        htmlContent += `<div class="msg-time">${msg.timestamp}</div>`;

        bubble.innerHTML = htmlContent;
        container.appendChild(bubble);
        container.scrollTop = container.scrollHeight;
      }
    });

    function promptCreateGroup() {
      const groupName = prompt("Введите имя группы Храма:");
      if (groupName) {
        socket.emit('create-group', { name: groupName, members: [], ownerUid: userUid });
      }
    }

    socket.on('group-created', (group) => {
      const listEl = document.getElementById('chat-list');
      listEl.innerHTML += `
        <div class="chat-item" onclick="selectActiveChat('${group.id}', true, '👥 ${group.name}')">
          <div class="avatar">👥</div>
          <div class="chat-info">
            <div class="chat-name">${group.name}</div>
          </div>
        </div>
      `;
    });

    // --- Звонки Храма (Личные и Групповые) ---
    async function initiateCall() {
      document.getElementById('call-modal').style.display = 'flex';
      document.getElementById('call-status-text').innerText = 'Вызов пользователей...';

      localMediaStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      document.getElementById('local-video').srcObject = localMediaStream;

      peerConn = new RTCPeerConnection(rtcConfiguration);
      localMediaStream.getTracks().forEach(track => peerConn.addTrack(track, localMediaStream));

      peerConn.ontrack = (event) => {
        document.getElementById('remote-video').srcObject = event.streams[0];
      };

      peerConn.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit('ice-candidate', { candidate: event.candidate, targetUid: activeChatId, isGroup: isGroupChat });
        }
      };

      const offer = await peerConn.createOffer();
      await peerConn.setLocalDescription(offer);

      socket.emit('call-user', { senderUid: userUid, targetUid: activeChatId, isGroup: isGroupChat, offer: offer });
    }

    socket.on('incoming-call', async (data) => {
      pendingCallData = data;
      document.getElementById('call-modal').style.display = 'flex';
      document.getElementById('call-status-text').innerText = `Входящий звонок от ${data.fromName}...`;
      document.getElementById('accept-call-btn').style.display = 'inline-block';

      try { callRingtone.play(); } catch(err){}
    });

    async function acceptIncomingCall() {
      callRingtone.pause();
      callRingtone.currentTime = 0;
      document.getElementById('accept-call-btn').style.display = 'none';
      document.getElementById('call-status-text').innerText = 'Связь установлена';

      localMediaStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      document.getElementById('local-video').srcObject = localMediaStream;

      peerConn = new RTCPeerConnection(rtcConfiguration);
      localMediaStream.getTracks().forEach(track => peerConn.addTrack(track, localMediaStream));

      peerConn.ontrack = (event) => {
        document.getElementById('remote-video').srcObject = event.streams[0];
      };

      peerConn.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit('ice-candidate', { candidate: event.candidate, targetUid: pendingCallData.fromUid, isGroup: pendingCallData.isGroup });
        }
      };

      await peerConn.setRemoteDescription(new RTCSessionDescription(pendingCallData.offer));
      const answer = await peerConn.createAnswer();
      await peerConn.setLocalDescription(answer);

      socket.emit('make-answer', { answer: answer, targetUid: pendingCallData.fromUid, isGroup: pendingCallData.isGroup });
    }

    socket.on('call-answered', async (data) => {
      if (peerConn) {
        await peerConn.setRemoteDescription(new RTCSessionDescription(data.answer));
        document.getElementById('call-status-text').innerText = 'Разговор...';
      }
    });

    socket.on('ice-candidate', async (data) => {
      if (peerConn && data.candidate) {
        await peerConn.addIceCandidate(new RTCIceCandidate(data.candidate));
      }
    });

    function hangUpCall() {
      callRingtone.pause();
      callRingtone.currentTime = 0;
      if (peerConn) peerConn.close();
      if (localMediaStream) localMediaStream.getTracks().forEach(t => t.stop());
      
      document.getElementById('call-modal').style.display = 'none';
      socket.emit('end-call', { targetUid: activeChatId, isGroup: isGroupChat });
    }

    socket.on('call-ended', () => {
      callRingtone.pause();
      callRingtone.currentTime = 0;
      if (peerConn) peerConn.close();
      if (localMediaStream) localMediaStream.getTracks().forEach(t => t.stop());
      document.getElementById('call-modal').style.display = 'none';
    });
  </script>
</body>
  </html>
