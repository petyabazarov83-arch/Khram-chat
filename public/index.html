<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Храм</title>
  <style>
    :root {
      --bg-main: #0b0e14;
      --bg-panel: #161b22;
      --border-color: #30363d;
      --text-main: #e6edf3;
      --text-muted: #8b949e;
      --brand-color: #f59e0b;
      --msg-mine-bg: #27272a;
      --msg-other-bg: #1e293b;
    }

    body.light-theme {
      --bg-main: #f3f4f6;
      --bg-panel: #ffffff;
      --border-color: #e5e7eb;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --msg-mine-bg: #dbeafe;
      --msg-other-bg: #ffffff;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 0;
      height: 100%; width: 100%;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: -webkit-fill-available;
      width: 100vw;
      max-width: 100vw;
      position: relative;
      overflow: hidden;
    }

    header {
      background: var(--bg-panel); padding: 10px 16px; display: flex;
      justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color);
      z-index: 10;
    }
    .brand { display: flex; align-items: center; gap: 8px; }
    .brand h1 { margin: 0; font-size: 18px; color: var(--brand-color); font-weight: bold; letter-spacing: 2px; transition: color 0.3s; }

    .nav-tabs { display: flex; background: var(--bg-panel); border-bottom: 1px solid var(--border-color); z-index: 10; }
    .tab-btn {
      flex: 1; padding: 12px; background: none; border: none;
      color: var(--text-muted); font-weight: bold; cursor: pointer; border-bottom: 2px solid transparent;
    }
    .tab-btn.active { color: var(--brand-color); border-bottom-color: var(--brand-color); }

    .page { display: none; flex: 1; flex-direction: column; overflow: hidden; width: 100%; }
    .page.active { display: flex !important; }

    .profile-card {
      padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; overflow-y: auto;
    }
    .avatar-preview {
      width: 90px; height: 90px; border-radius: 50%; object-fit: cover;
      background: #1f6beb; border: 3px solid var(--brand-color); display: flex;
      align-items: center; justify-content: center; font-size: 36px; color: #fff; overflow: hidden;
    }
    .input-field {
      width: 100%; max-width: 320px; padding: 10px 14px; background: var(--bg-panel);
      border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); font-size: 14px; outline: none;
    }
    .uid-box {
      background: var(--bg-panel); border: 1px solid var(--border-color); padding: 10px 14px;
      border-radius: 8px; font-family: monospace; color: var(--brand-color); width: 100%; max-width: 320px; text-align: center;
    }

    #chat-list { flex: 1; overflow-y: auto; }
    .chat-item {
      padding: 12px 16px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center;
      gap: 12px; cursor: pointer;
    }
    .chat-item:hover { background: var(--bg-panel); }
    .chat-avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: #21262d; display: flex; align-items: center; justify-content: center; font-weight: bold; overflow: hidden; flex-shrink: 0; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #6e7681; display: inline-block; margin-right: 6px; }
    .status-dot.online { background: #22c55e; }

    #chat-window-modal {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg-main); z-index: 50; width: 100%; height: 100%;
    }

    #messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; background-size: cover; background-position: center; }

    .msg {
      max-width: 85%; padding: 8px 12px; border-radius: 12px; font-size: 14px; word-break: break-word;
      display: flex; flex-direction: column; position: relative; color: var(--text-main);
    }
    .msg.mine { align-self: flex-end; background: var(--msg-mine-bg); border: 1px solid var(--border-color); }
    .msg.other { align-self: flex-start; background: var(--msg-other-bg); border: 1px solid var(--border-color); }
    .msg-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 11px; color: var(--brand-color); font-weight: bold; margin-bottom: 4px; }

    .chat-media-img {
      max-width: 100%;
      max-height: 250px;
      border-radius: 8px;
      margin-top: 4px;
      object-fit: cover;
      cursor: pointer;
    }

    .video-circle-container {
      width: clamp(140px, 45vw, 200px);
      height: clamp(140px, 45vw, 200px);
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid var(--brand-color);
      margin-top: 4px;
      position: relative;
      background: #000;
      cursor: pointer;
    }
    .video-circle-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .audio-player-wrapper {
      display: flex; align-items: center; gap: 6px; width: 220px; max-width: 100%; margin-top: 4px;
    }
    .audio-player-wrapper audio {
      width: 100%; height: 36px; outline: none;
    }

    #controls { background: var(--bg-panel); padding: 8px; border-top: 1px solid var(--border-color); }
    .input-row { display: flex; align-items: center; gap: 6px; }
    #input { flex: 1; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: 20px; background: var(--bg-main); color: var(--text-main); font-size: 14px; outline: none; min-width: 0; }
    .btn-icon { background: var(--bg-panel); border: 1px solid var(--border-color); color: var(--text-main); width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; flex-shrink: 0; user-select: none; }
    .btn-icon.active-rec { background: #ef4444; color: white; animation: pulse 1s infinite; }

    .rec-timer {
      font-size: 12px;
      color: #ef4444;
      font-weight: bold;
      margin-left: 4px;
      display: none;
    }
    .rec-timer.active { display: inline-block; }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .btn-send { background: var(--brand-color); border: none; color: #000; font-weight: bold; }

    .modal {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85); z-index: 1000; flex-direction: column;
      align-items: center; justify-content: center; padding: 20px;
    }
    .modal.active { display: flex !important; }

    #circle-modal {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.95); z-index: 2000; flex-direction: column;
      align-items: center; justify-content: center;
    }
    #circle-modal.active { display: flex !important; }
    #circle-modal-video {
      width: clamp(220px, 75vw, 340px);
      height: clamp(220px, 75vw, 340px);
      border-radius: 50%; object-fit: cover;
      border: 4px solid var(--brand-color); box-shadow: 0 0 25px rgba(0,0,0,0.9);
    }

    #call-modal {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #0d1117;
      flex-direction: column; align-items: center; justify-content: space-between; padding: 16px 10px; z-index: 1000;
      box-sizing: border-box;
    }
    #call-modal.active { display: flex !important; }
    
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      width: 100%;
      max-width: 800px;
      flex: 1;
      overflow-y: auto;
      align-items: center;
      justify-content: center;
      padding: 10px;
      box-sizing: border-box;
    }
    .video-card {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 180px;
      max-height: 60vh;
      background: #161b22;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }
    .video-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .video-card .user-label {
      position: absolute;
      bottom: 6px;
      left: 6px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
    }
    
    .call-controls { display: flex; gap: 8px; margin-top: 15px; flex-wrap: wrap; justify-content: center; }
    .call-btn { background: #22c55e; border: none; color: white; padding: 10px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 13px; }
    .call-btn.off { background: #4b5563; }
    .call-btn.danger { background: #ef4444; }

    #record-modal {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85);
      flex-direction: column; align-items: center; justify-content: center; gap: 15px; z-index: 1000;
    }
    #record-modal.active { display: flex !important; }
    #circle-preview-wrapper {
      position: relative;
      width: clamp(180px, 60vw, 240px);
      height: clamp(180px, 60vw, 240px);
    }
    #circle-preview {
      width: 100%; height: 100%; border-radius: 50%; border: 4px solid var(--brand-color); object-fit: cover; background: #000;
    }
    .circle-recording-overlay {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(239, 68, 68, 0.8);
      color: white;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
    }

    @media (min-width: 768px) {
      #app {
        flex-direction: row;
        max-width: 1200px;
        margin: 0 auto;
        border-left: 1px solid var(--border-color);
        border-right: 1px solid var(--border-color);
      }
      #main-header {
        position: absolute;
        top: 0;
        left: 0;
        width: 320px;
        border-right: 1px solid var(--border-color);
      }
      .nav-tabs {
        position: absolute;
        top: 57px;
        left: 0;
        width: 320px;
        border-right: 1px solid var(--border-color);
      }
      .page {
        margin-top: 105px;
        width: 320px !important;
        border-right: 1px solid var(--border-color);
      }
      #chat-window-modal {
        position: relative !important;
        flex: 1 !important;
        width: auto !important;
        display: flex !important;
        z-index: 1 !important;
      }
    }
  </style>
</head>
<body>

  <div id="app">
    <header id="main-header">
      <div class="brand">
        <span>✨</span>
        <h1 id="brand-title">ХРАМ</h1>
      </div>
      <div style="display:flex; gap:6px;">
        <button class="btn-icon" id="create-group-btn" title="Создать групповой чат">👥+</button>
        <button class="btn-icon" id="sync-sim-btn" title="Поиск контактов">📱+</button>
      </div>
    </header>

    <div class="nav-tabs" id="main-tabs">
      <button class="tab-btn active" id="tab-btn-chats">Чаты</button>
      <button class="tab-btn" id="tab-btn-profile">Профиль</button>
      <button class="tab-btn" id="tab-btn-settings">Настройки</button>
    </div>

    <!-- Вкладка: Чаты -->
    <div id="chats-page" class="page active">
      <div id="chat-list">
        <div class="chat-item" id="bot-chat-item">
          <div class="chat-avatar">🤖</div>
          <div>
            <strong>ИИ Помощник 🤖</strong>
            <div style="font-size:12px; color:var(--text-muted);">Помощник чата</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Вкладка: Профиль -->
    <div id="profile-page" class="page">
      <div class="profile-card">
        <div id="avatar-display" class="avatar-preview">👤</div>
        <label style="color:var(--brand-color); cursor:pointer; font-size:13px;">
          Загрузить аватарку
          <input type="file" id="avatar-input" accept="image/*" style="display:none;">
        </label>

        <div style="width:100%; max-width:320px;">
          <label style="font-size:12px; color:var(--text-muted);">Ваше имя / Ник:</label>
          <input id="username-input" class="input-field" placeholder="Введите имя..." />
        </div>

        <div style="width:100%; max-width:320px;">
          <label style="font-size:12px; color:var(--text-muted);">Ваш номер телефона:</label>
          <input id="phone-input" class="input-field" placeholder="+7 999 000 00 00" />
        </div>

        <button class="call-btn" id="save-profile-btn" style="width:100%; max-width:320px; justify-content:center;">Сохранить профиль</button>

        <div style="font-size: 13px; color: var(--text-muted); margin-top:10px;">ВАШ UID:</div>
        <div class="uid-box" id="my-uid">Загрузка...</div>
      </div>
    </div>

    <!-- Вкладка: Настройки -->
    <div id="settings-page" class="page">
      <div class="profile-card">
        <h3>🎨 Тема оформления</h3>
        <select id="theme-select" class="input-field">
          <option value="dark">Тёмная тема</option>
          <option value="light">Светлая тема</option>
        </select>

        <h3>🎨 Цвет названия «ХРАМ»</h3>
        <select id="brand-color-select" class="input-field">
          <option value="#f59e0b">Янтарный</option>
          <option value="#ef4444">Красный</option>
          <option value="#22c55e">Зеленый</option>
          <option value="#3b82f6">Синий</option>
          <option value="#a855f7">Фиолетовый</option>
        </select>

        <h3>🔔 Рингтон звонка (до 46 МБ)</h3>
        <label class="call-btn" style="justify-content:center; width:100%; max-width:320px;">
          📁 Выбрать аудиофайл
          <input type="file" id="ringtone-input" accept="audio/*" style="display:none;">
        </label>
        <div id="ringtone-status" style="font-size:12px; color:var(--text-muted); text-align:center;">Стандартный рингтон</div>
        <div style="display:flex; gap:8px; width:100%; max-width:320px;">
          <button id="play-ringtone-btn" class="call-btn" style="flex:1; justify-content:center;">▶ Прослушать</button>
          <button id="reset-ringtone-btn" class="call-btn danger" style="flex:1; justify-content:center;">Сбросить</button>
        </div>
      </div>
    </div>

    <!-- Окно чата -->
    <div id="chat-window-modal" class="page">
      <div id="chat-header" style="background:var(--bg-panel); padding:8px 16px; border-bottom:1px solid var(--border-color); display:flex; justify-content:space-between; align-items:center;">
        <button class="btn-icon" id="close-chat-btn">←</button>
        <div style="display:flex; align-items:center; gap:10px;">
          <div id="active-chat-avatar" class="chat-avatar" style="width:36px; height:36px;">👤</div>
          <div>
            <strong id="active-chat-title">Чат</strong>
            <div id="active-chat-status" style="font-size:11px; color:var(--text-muted);">⚪ Офлайн</div>
          </div>
        </div>
        <div style="display:flex; gap:6px;">
          <button class="btn-icon" id="bg-settings-btn" title="Фон чата">🖼️</button>
          <button class="btn-icon" id="delete-chat-btn" title="Удалить чат" style="color: #ef4444;">🗑</button>
          <button class="call-btn" id="start-call-btn">📞 Звонок</button>
        </div>
      </div>

      <div id="messages"></div>

      <div id="controls">
        <div class="input-row">
          <label class="btn-icon" title="Отправить любой файл (Zip, Документы, Картинки)">
            📎<input type="file" id="file-input" style="display:none;" accept="*/*">
          </label>
          <button class="btn-icon" id="record-audio-btn" title="Голосовое сообщение">🎤</button>
          <span id="audio-timer" class="rec-timer">00:00</span>
          <button class="btn-icon" id="record-circle-btn" title="Видеокружочек">⭕</button>
          <input id="input" autocomplete="off" placeholder="Сообщение..." />
          <button class="btn-icon btn-send" id="send-btn">➔</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Модалка просмотра видеокружочка -->
  <div id="circle-modal" onclick="closeCircleModal()">
    <video id="circle-modal-video" autoplay playsinline loop></video>
  </div>

  <!-- Модалка создания группы -->
  <div id="group-modal" class="modal">
    <div class="modal-content" style="background:var(--bg-panel); padding:20px; border-radius:12px; border:1px solid var(--border-color); width:100%; max-width:320px;">
      <h3>👥 Создать группу</h3>
      <input id="group-name-input" class="input-field" placeholder="Название группы..." style="margin-bottom:10px;" />
      <div style="font-size:12px; color:var(--text-muted); margin-bottom:6px;">Выберите участников:</div>
      <div id="group-members-list" style="max-height:150px; overflow-y:auto; display:flex; flex-direction:column; gap:6px; margin-bottom:15px;"></div>
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button class="call-btn danger" id="cancel-group-btn">Отмена</button>
        <button class="call-btn" id="confirm-create-group-btn">Создать</button>
      </div>
    </div>
  </div>

  <!-- Модалка смены фона -->
  <div id="bg-modal" class="modal">
    <div class="modal-content" style="background:var(--bg-panel); padding:20px; border-radius:12px; border:1px solid var(--border-color); display:flex; flex-direction:column; gap:10px; width:100%; max-width:320px;">
      <h3>🖼️ Фон чата</h3>
      <label class="call-btn" style="justify-content:center;">
        Загрузить картинку
        <input type="file" id="bg-file-input" accept="image/*" style="display:none;">
      </label>
      <button class="call-btn danger" id="reset-bg-btn">Сбросить фон</button>
      <button class="call-btn danger" id="close-bg-btn">Закрыть</button>
    </div>
  </div>

  <!-- Окно звонка -->
  <div id="call-modal">
    <div id="call-user-info" style="color:#fff; font-size:18px; font-weight:bold; margin-bottom:10px; display:flex; align-items:center; gap:10px;">
      <div id="call-avatar" class="chat-avatar" style="width:40px; height:40px;">👥</div>
      <span id="call-username">Звонок...</span>
    </div>

    <div class="video-grid" id="video-grid">
      <div class="video-card" id="local-video-card">
        <video id="local-video" autoplay playsinline muted></video>
        <div class="user-label">Вы</div>
      </div>
    </div>

    <div class="call-controls">
      <button id="toggle-mic-btn" class="call-btn">🎤 Вкл</button>
      <button id="toggle-cam-btn" class="call-btn">📷 Вкл</button>
      <button id="switch-cam-btn" class="call-btn">🔄 Камера</button>
      <button id="share-screen-btn" class="call-btn">🖥️ Экран</button>
      <button id="accept-call-btn" class="call-btn" style="display:none;">Ответить</button>
      <button id="end-call-btn" class="call-btn danger">Завершить</button>
    </div>
  </div>

  <!-- Запись кружка -->
  <div id="record-modal">
    <div id="circle-preview-wrapper">
      <canvas id="circle-preview" width="480" height="480" style="width:100%; height:100%; border-radius:50%; border:4px solid var(--brand-color); object-fit:cover; background:#000;"></canvas>
      <div id="circle-rec-timer" class="circle-recording-overlay">00:00</div>
    </div>
    <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center;">
      <button class="call-btn" id="switch-circle-cam-btn">🔄 Камера</button>
      <button class="call-btn danger" id="cancel-record-btn">Отмена</button>
      <button class="call-btn" id="stop-record-btn">Отправить</button>
    </div>
  </div>

  <input type="file" id="vcf-file-input" accept=".vcf" style="display:none;">

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    let myProfile = {
      uid: localStorage.getItem('khram_uid') || ('khram-user-' + Math.random().toString(36).substring(2, 8)),
      username: localStorage.getItem('khram_username') || 'Путник',
      avatar: localStorage.getItem('khram_avatar') || '',
      phone: localStorage.getItem('khram_phone') || ''
    };
    localStorage.setItem('khram_uid', myProfile.uid);

    document.getElementById('my-uid').textContent = myProfile.uid;
    document.getElementById('username-input').value = myProfile.username;
    document.getElementById('phone-input').value = myProfile.phone;

    function updateMyAvatarDisplay() {
      if (myProfile.avatar) {
        document.getElementById('avatar-display').innerHTML = `<img src="${myProfile.avatar}" style="width:100%;height:100%;object-fit:cover;">`;
      }
    }
    updateMyAvatarDisplay();

    socket.on('connect', () => {
      socket.emit('register', myProfile);
    });

    document.getElementById('save-profile-btn').addEventListener('click', () => {
      myProfile.username = document.getElementById('username-input').value.trim() || 'Путник';
      myProfile.phone = document.getElementById('phone-input').value.trim();
      localStorage.setItem('khram_username', myProfile.username);
      localStorage.setItem('khram_phone', myProfile.phone);
      socket.emit('register', myProfile);
      alert('Профиль сохранен!');
    });

    document.getElementById('avatar-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          myProfile.avatar = evt.target.result;
          localStorage.setItem('khram_avatar', myProfile.avatar);
          updateMyAvatarDisplay();
          socket.emit('register', myProfile);
        };
        reader.readAsDataURL(file);
      }
    });

    // НАВИГАЦИЯ
    const tabBtns = document.querySelectorAll('.tab-btn');
    const pages = document.querySelectorAll('.page');

    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const targetPage = btn.id.replace('tab-btn-', '') + '-page';
        tabBtns.forEach(b => b.classList.remove('active'));
        pages.forEach(p => p.classList.remove('active'));

        btn.classList.add('active');
        const activePage = document.getElementById(targetPage);
        if (activePage) activePage.classList.add('active');
      });
    });

    // НАСТРОЙКИ ТЕМЫ
    const themeSelect = document.getElementById('theme-select');
    const brandColorSelect = document.getElementById('brand-color-select');
    const brandTitle = document.getElementById('brand-title');

    const savedTheme = localStorage.getItem('khram_theme') || 'dark';
    const savedBrandColor = localStorage.getItem('khram_brand_color') || '#f59e0b';

    function applyTheme(theme) {
      if (theme === 'light') {
        document.body.classList.add('light-theme');
      } else {
        document.body.classList.remove('light-theme');
      }
      themeSelect.value = theme;
      localStorage.setItem('khram_theme', theme);
    }

    function applyBrandColor(color) {
      document.documentElement.style.setProperty('--brand-color', color);
      brandTitle.style.color = color;
      brandColorSelect.value = color;
      localStorage.setItem('khram_brand_color', color);
    }

    applyTheme(savedTheme);
    applyBrandColor(savedBrandColor);

    themeSelect.addEventListener('change', (e) => applyTheme(e.target.value));
    brandColorSelect.addEventListener('change', (e) => applyBrandColor(e.target.value));

    // РИНГТОН
    let customRingtone = localStorage.getItem('khram_ringtone') || null;
    let ringtoneAudio = new Audio();

    if (customRingtone) {
      document.getElementById('ringtone-status').textContent = 'Пользовательский рингтон загружен';
      ringtoneAudio.src = customRingtone;
    }

    document.getElementById('ringtone-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          customRingtone = evt.target.result;
          localStorage.setItem('khram_ringtone', customRingtone);
          ringtoneAudio.src = customRingtone;
          document.getElementById('ringtone-status').textContent = 'Пользовательский рингтон загружен';
          alert('Рингтон сохранен!');
        };
        reader.readAsDataURL(file);
      }
    });

    document.getElementById('play-ringtone-btn').addEventListener('click', () => {
      if (ringtoneAudio.paused) {
        ringtoneAudio.play().catch(() => {});
        document.getElementById('play-ringtone-btn').textContent = '⏸ Остановить';
      } else {
        ringtoneAudio.pause();
        ringtoneAudio.currentTime = 0;
        document.getElementById('play-ringtone-btn').textContent = '▶ Прослушать';
      }
    });

    document.getElementById('reset-ringtone-btn').addEventListener('click', () => {
      localStorage.removeItem('khram_ringtone');
      customRingtone = null;
      ringtoneAudio.pause();
      ringtoneAudio = new Audio();
      document.getElementById('ringtone-status').textContent = 'Стандартный рингтон';
      document.getElementById('play-ringtone-btn').textContent = '▶ Прослушать';
    });

    // КОНТАКТЫ И ПОИСК
    let contacts = JSON.parse(localStorage.getItem('khram_contacts') || '[]');
    let myGroups = JSON.parse(localStorage.getItem('khram_groups') || '[]');
    let activeOnlineUids = [];

    document.getElementById('sync-sim-btn').addEventListener('click', async () => {
      let extractedPhones = [];
      if ('contacts' in navigator && 'ContactsManager' in window) {
        try {
          const selectedContacts = await navigator.contacts.select(['tel'], { multiple: true });
          selectedContacts.forEach(c => { if (c.tel) c.tel.forEach(t => extractedPhones.push(t)); });
        } catch (err) {}
      }
      if (extractedPhones.length === 0) {
        const option = confirm("Нажмите 'ОК', чтобы выбрать файл .vcf, или 'Отмена', чтобы ввести номер вручную.");
        if (option) {
          document.getElementById('vcf-file-input').click();
          return;
        } else {
          const input = prompt('Введите номер телефона для поиска:');
          if (input) extractedPhones = input.split(',').map(p => p.trim());
        }
      }
      if (extractedPhones.length > 0) socket.emit('sync-contacts', extractedPhones);
    });

    document.getElementById('vcf-file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        const matches = evt.target.result.match(/TEL.*?:([+\d\s\-\(\)]+)/gi) || [];
        const foundPhones = matches.map(m => m.replace(/TEL.*?:/i, '').trim());
        if (foundPhones.length > 0) socket.emit('sync-contacts', foundPhones);
      };
      reader.readAsText(file);
    });

    socket.on('contacts-synced', (foundContacts) => {
      let newCount = 0;
      foundContacts.forEach(fc => {
        if (fc.uid !== myProfile.uid) {
          const existingIdx = contacts.findIndex(c => c.uid === fc.uid);
          if (existingIdx !== -1) {
            contacts[existingIdx].name = fc.name;
            contacts[existingIdx].avatar = fc.avatar;
          } else {
            contacts.push({ uid: fc.uid, name: fc.name, avatar: fc.avatar });
            newCount++;
          }
        }
      });
      localStorage.setItem('khram_contacts', JSON.stringify(contacts));
      renderContacts();
      alert(newCount > 0 ? `🎉 Найдено новых пользователей: ${newCount}!` : 'Поиск завершен.');
    });

    socket.on('online-users-list', (onlineUids) => {
      activeOnlineUids = onlineUids;
      renderContacts();
      updateChatHeaderStatus();
    });

    function renderContacts() {
      const chatList = document.getElementById('chat-list');
      chatList.querySelectorAll('.dynamic-item').forEach(el => el.remove());

      myGroups.forEach(g => {
        const div = document.createElement('div');
        div.className = 'chat-item dynamic-item';
        div.onclick = () => openChat(g.id, g.name, '', true);
        div.innerHTML = `
          <div style="display:flex; align-items:center; gap:12px; flex:1;">
            <div class="chat-avatar" style="background:var(--brand-color); color:#000;">👥</div>
            <div><strong>${escapeHTML(g.name)}</strong><div style="font-size:12px; color:var(--text-muted);">Групповой чат</div></div>
          </div>
        `;
        chatList.appendChild(div);
      });

      contacts.forEach(c => {
        const isOnline = activeOnlineUids.includes(c.uid);
        const div = document.createElement('div');
        div.className = 'chat-item dynamic-item';
        div.onclick = () => openChat(c.uid, c.name, c.avatar, false);
        div.innerHTML = `
          <div style="display:flex; align-items:center; gap:12px; flex:1;">
            <div class="chat-avatar">${c.avatar ? `<img src="${c.avatar}" style="width:100%;height:100%;object-fit:cover;">` : '👤'}</div>
            <div>
              <strong>${escapeHTML(c.name)}</strong>
              <div style="font-size:12px; color:var(--text-muted);"><span class="status-dot ${isOnline ? 'online' : ''}"></span>${isOnline ? 'Онлайн' : 'Офлайн'}</div>
            </div>
          </div>
        `;
        chatList.appendChild(div);
      });
    }

    document.getElementById('bot-chat-item').addEventListener('click', () => {
      openChat('bot-assistant', 'ИИ Помощник 🤖', '🤖', false);
    });

    // Окно чата
    let currentChatUid = null;
    let isCurrentGroup = false;

    function getHistoryKey(targetUid) {
      return `khram_history_${targetUid}`;
    }

    function openChat(targetUid, name, avatar, isGroup) {
      currentChatUid = targetUid;
      isCurrentGroup = isGroup;

      document.getElementById('active-chat-title').textContent = name;
      const avatarEl = document.getElementById('active-chat-avatar');
      if (avatar) {
        avatarEl.innerHTML = `<img src="${avatar}" style="width:100%;height:100%;object-fit:cover;">`;
      } else {
        avatarEl.innerHTML = isGroup ? '👥' : '👤';
      }

      updateChatHeaderStatus();

      const bgData = localStorage.getItem(`chat_bg_${targetUid}`);
      document.getElementById('messages').style.backgroundImage = bgData ? `url(${bgData})` : 'none';

      document.getElementById('chat-window-modal').classList.add('active');
      
      socket.emit('get-chat-history', { myUid: myProfile.uid, targetUid: targetUid, isGroup: isGroup });
      
      loadMessagesHistory(targetUid);
    }

    document.getElementById('close-chat-btn').addEventListener('click', () => {
      document.getElementById('chat-window-modal').classList.remove('active');
      currentChatUid = null;
    });

    function updateChatHeaderStatus() {
      if (!currentChatUid) return;
      const statusEl = document.getElementById('active-chat-status');
      if (isCurrentGroup) {
        statusEl.textContent = 'Групповой чат';
      } else if (currentChatUid === 'bot-assistant') {
        statusEl.textContent = '🟢 Онлайн 24/7';
      } else {
        const isOnline = activeOnlineUids.includes(currentChatUid);
        statusEl.textContent = isOnline ? '🟢 Онлайн' : '⚪ Офлайн';
      }
    }

    function loadMessagesHistory(targetUid) {
      const messagesContainer = document.getElementById('messages');
      messagesContainer.innerHTML = '';
      const history = JSON.parse(localStorage.getItem(getHistoryKey(targetUid)) || '[]');
      history.forEach(msg => appendMessageToUI(msg));
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function saveMessageToHistory(targetUid, msg) {
      const key = getHistoryKey(targetUid);
      const history = JSON.parse(localStorage.getItem(key) || '[]');
      
      if (msg.id && history.some(m => m.id === msg.id)) return;

      history.push(msg);
      localStorage.setItem(key, JSON.stringify(history));
    }

    function appendMessageToUI(msg) {
      const messagesContainer = document.getElementById('messages');
      const isMine = msg.senderUid === myProfile.uid;

      if (msg.id && messagesContainer.querySelector(`[data-id="${msg.id}"]`)) return;

      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${isMine ? 'mine' : 'other'}`;
      if (msg.id) msgDiv.dataset.id = msg.id;

      let contentHTML = '';

      if (msg.type === 'text') {
        contentHTML = `<div>${escapeHTML(msg.content)}</div>`;
      } else if (msg.type === 'audio') {
        contentHTML = `<div class="audio-player-wrapper"><audio src="${msg.content}" controls style="max-width:200px; height:36px;"></audio></div>`;
      } else if (msg.type === 'circle' || msg.type === 'round' || msg.type === 'video-circle') {
        contentHTML = `
          <div class="video-circle-container" data-src="${encodeURIComponent(msg.content)}">
            <video src="${msg.content}" autoplay loop muted playsinline></video>
          </div>
        `;
      } else if (msg.type === 'file') {
        if (msg.fileType && msg.fileType.startsWith('image/')) {
          contentHTML = `<img src="${msg.content}" class="chat-media-img" onclick="window.open('${msg.content}', '_blank')">`;
        } else {
          contentHTML = `<a href="${msg.content}" download="${msg.fileName || 'file'}" style="color:var(--brand-color); text-decoration:underline; font-weight:bold;">📁 ${escapeHTML(msg.fileName || 'Скачать файл')}</a>`;
        }
      }

      msgDiv.innerHTML = `
        <div class="msg-header">
          <span>${escapeHTML(msg.senderName || 'Пользователь')}</span>
          <span>${msg.timestamp || ''}</span>
        </div>
        ${contentHTML}
      `;

      messagesContainer.appendChild(msgDiv);
      
      const circleEl = msgDiv.querySelector('.video-circle-container');
      if (circleEl) {
        circleEl.addEventListener('click', () => {
          const rawSrc = decodeURIComponent(circleEl.dataset.src);
          playCircleModal(rawSrc);
        });
      }

      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function sendMessage() {
      const input = document.getElementById('input');
      const text = input.value.trim();
      if (!text || !currentChatUid) return;

      const now = new Date();
      const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

      const msgData = {
        id: 'msg-' + Date.now() + '-' + Math.random().toString(36).substring(2, 6),
        senderUid: myProfile.uid,
        senderName: myProfile.username,
        targetUid: currentChatUid,
        isGroup: isCurrentGroup,
        type: 'text',
        content: text,
        timestamp: timeStr
      };

      appendMessageToUI(msgData);
      saveMessageToHistory(currentChatUid, msgData);
      socket.emit('chat message', msgData);
      input.value = '';
    }

    document.getElementById('send-btn').addEventListener('click', sendMessage);
    document.getElementById('input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    document.getElementById('file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file || !currentChatUid) return;

      const now = new Date();
      const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

      const reader = new FileReader();
      reader.onload = (evt) => {
        const msgData = {
          id: 'file-' + Date.now() + '-' + Math.random().toString(36).substring(2, 6),
          senderUid: myProfile.uid,
          senderName: myProfile.username,
          targetUid: currentChatUid,
          isGroup: isCurrentGroup,
          type: 'file',
          content: evt.target.result,
          fileName: file.name,
          fileType: file.type,
          fileSize: file.size,
          timestamp: timeStr
        };

        appendMessageToUI(msgData);
        saveMessageToHistory(currentChatUid, msgData);
        socket.emit('chat message', msgData);
        e.target.value = '';
      };
      reader.readAsDataURL(file);
    });

    socket.on('chat message', (msg) => {
      let chatKeyUid;

      if (msg.isGroup) {
        chatKeyUid = msg.targetUid;
      } else {
        chatKeyUid = (msg.senderUid === myProfile.uid) ? msg.targetUid : msg.senderUid;

        if (msg.senderUid !== myProfile.uid && !contacts.some(c => c.uid === msg.senderUid)) {
          contacts.push({
            uid: msg.senderUid,
            name: msg.senderName || 'Пользователь',
            avatar: ''
          });
          localStorage.setItem('khram_contacts', JSON.stringify(contacts));
          renderContacts();
        }
      }

      saveMessageToHistory(chatKeyUid, msg);

      if (currentChatUid === chatKeyUid) {
        appendMessageToUI(msg);
      }
    });

    socket.on('chat-history', (data) => {
      if (data.history && Array.isArray(data.history)) {
        data.history.forEach(msg => {
          let chatKeyUid = msg.isGroup ? msg.targetUid : ((msg.senderUid === myProfile.uid) ? msg.targetUid : msg.senderUid);
          saveMessageToHistory(chatKeyUid, msg);
        });
        if (currentChatUid === data.targetUid) {
          loadMessagesHistory(currentChatUid);
        }
      }
    });

    // УДАЛЕНИЕ ЧАТА
    document.getElementById('delete-chat-btn').addEventListener('click', () => {
      if (!currentChatUid) return;
      if (confirm('Вы уверены, что хотите удалить этот чат и всю историю?')) {
        localStorage.removeItem(getHistoryKey(currentChatUid));
        localStorage.removeItem(`chat_bg_${currentChatUid}`);

        if (isCurrentGroup) {
          myGroups = myGroups.filter(g => g.id !== currentChatUid);
          localStorage.setItem('khram_groups', JSON.stringify(myGroups));
        } else {
          contacts = contacts.filter(c => c.uid !== currentChatUid);
          localStorage.setItem('khram_contacts', JSON.stringify(contacts));
        }

        socket.emit('delete-chat', { chatId: currentChatUid, isGroup: isCurrentGroup, userUid: myProfile.uid });
        renderContacts();
        document.getElementById('close-chat-btn').click();
      }
    });

    // МОДАЛКА КРУЖКА
    function playCircleModal(src) {
      const circleModal = document.getElementById('circle-modal');
      const video = document.getElementById('circle-modal-video');
      video.src = src;
      circleModal.classList.add('active');
      video.play().catch(() => {});
    }

    function closeCircleModal() {
      const circleModal = document.getElementById('circle-modal');
      const video = document.getElementById('circle-modal-video');
      video.pause();
      video.src = '';
      circleModal.classList.remove('active');
    }

    // СОЗДАНИЕ ГРУППЫ
    const groupModal = document.getElementById('group-modal');
    document.getElementById('create-group-btn').addEventListener('click', () => {
      const listDiv = document.getElementById('group-members-list');
      listDiv.innerHTML = '';
      contacts.forEach(c => {
        listDiv.innerHTML += `
          <label style="display:flex; align-items:center; gap:8px;">
            <input type="checkbox" value="${c.uid}" class="group-member-checkbox"> ${escapeHTML(c.name)}
          </label>
        `;
      });
      groupModal.classList.add('active');
    });

    document.getElementById('cancel-group-btn').addEventListener('click', () => groupModal.classList.remove('active'));

    document.getElementById('confirm-create-group-btn').addEventListener('click', () => {
      const name = document.getElementById('group-name-input').value.trim();
      const checkboxes = document.querySelectorAll('.group-member-checkbox:checked');
      const selectedMembers = Array.from(checkboxes).map(cb => cb.value);

      if (!name) return alert('Введите название группы!');
      socket.emit('create-group', { name, members: selectedMembers, ownerUid: myProfile.uid });
      groupModal.classList.remove('active');
      document.getElementById('group-name-input').value = '';
    });

    socket.on('group-created', (group) => {
      if (!myGroups.some(g => g.id === group.id)) {
        myGroups.push(group);
        localStorage.setItem('khram_groups', JSON.stringify(myGroups));
        renderContacts();
      }
    });

    // ФОН ЧАТА
    const bgModal = document.getElementById('bg-modal');
    document.getElementById('bg-settings-btn').addEventListener('click', () => bgModal.classList.add('active'));
    document.getElementById('close-bg-btn').addEventListener('click', () => bgModal.classList.remove('active'));

    document.getElementById('bg-file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file && currentChatUid) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          const bgData = evt.target.result;
          localStorage.setItem(`chat_bg_${currentChatUid}`, bgData);
          document.getElementById('messages').style.backgroundImage = `url(${bgData})`;
          bgModal.classList.remove('active');
        };
        reader.readAsDataURL(file);
      }
    });

    document.getElementById('reset-bg-btn').addEventListener('click', () => {
      if (currentChatUid) {
        localStorage.removeItem(`chat_bg_${currentChatUid}`);
        document.getElementById('messages').style.backgroundImage = 'none';
        bgModal.classList.remove('active');
      }
    });

    // ГОЛОСОВЫЕ СООБЩЕНИЯ
    let mediaRecorderAudio = null;
    let audioChunks = [];
    let audioTimerInterval = null;
    let audioSeconds = 0;

    const recordAudioBtn = document.getElementById('record-audio-btn');
    const audioTimerEl = document.getElementById('audio-timer');

    function formatTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    recordAudioBtn.addEventListener('click', async () => {
      if (mediaRecorderAudio && mediaRecorderAudio.state === 'recording') {
        mediaRecorderAudio.stop();
        recordAudioBtn.classList.remove('active-rec');
        audioTimerEl.classList.remove('active');
        clearInterval(audioTimerInterval);
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorderAudio = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorderAudio.ondataavailable = e => audioChunks.push(e.data);
        
        mediaRecorderAudio.onstop = () => {
          const blob = new Blob(audioChunks, { type: 'audio/webm' });
          const now = new Date();
          const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

          const reader = new FileReader();
          reader.onload = (evt) => {
            const audioMsg = {
              id: 'audio-' + Date.now() + '-' + Math.random().toString(36).substring(2, 6),
              senderUid: myProfile.uid,
              senderName: myProfile.username,
              targetUid: currentChatUid,
              isGroup: isCurrentGroup,
              type: 'audio',
              content: evt.target.result,
              timestamp: timeStr
            };

            appendMessageToUI(audioMsg);
            saveMessageToHistory(currentChatUid, audioMsg);
            socket.emit('chat message', audioMsg);
          };
          reader.readAsDataURL(blob);
          stream.getTracks().forEach(track => track.stop());
        };

        mediaRecorderAudio.start();
        recordAudioBtn.classList.add('active-rec');
        audioSeconds = 0;
        audioTimerEl.textContent = "00:00";
        audioTimerEl.classList.add('active');
        audioTimerInterval = setInterval(() => {
          audioSeconds++;
          audioTimerEl.textContent = formatTime(audioSeconds);
        }, 1000);
      } catch (err) {
        alert('Не удалось получить доступ к микрофону');
      }
    });

    // ==========================================
    // ВИДЕОКРУЖКИ (Переключение камер на лету через Canvas)
    // ==========================================
    let mediaRecorderCircle = null;
    let circleChunks = [];
    let circleStream = null;
    let circleTimerInterval = null;
    let circleSeconds = 0;
    let circleVideoDevices = [];
    let currentCircleDeviceIndex = 0;

    const circleCanvas = document.getElementById('circle-preview');
    const circleCtx = circleCanvas.getContext('2d');
    const circleHiddenVideo = document.createElement('video');
    circleHiddenVideo.autoplay = true;
    circleHiddenVideo.playsinline = true;
    circleHiddenVideo.muted = true;

    let circleCanvasAnimFrame = null;

    function drawCircleToCanvas() {
      if (circleHiddenVideo.readyState >= 2) {
        const minDim = Math.min(circleHiddenVideo.videoWidth, circleHiddenVideo.videoHeight);
        const sx = (circleHiddenVideo.videoWidth - minDim) / 2;
        const sy = (circleHiddenVideo.videoHeight - minDim) / 2;
        circleCtx.drawImage(circleHiddenVideo, sx, sy, minDim, minDim, 0, 0, 480, 480);
      }
      circleCanvasAnimFrame = requestAnimationFrame(drawCircleToCanvas);
    }

    async function getCameraDevices() {
      const devices = await navigator.mediaDevices.enumerateDevices();
      return devices.filter(d => d.kind === 'videoinput');
    }

    async function startCircleCameraStream(deviceId = null) {
      if (circleStream) {
        circleStream.getTracks().forEach(t => t.stop());
      }

      const videoConstraints = deviceId ? { deviceId: { exact: deviceId } } : { facingMode: 'user' };
      
      circleStream = await navigator.mediaDevices.getUserMedia({ 
        video: videoConstraints, 
        audio: true 
      });

      circleHiddenVideo.srcObject = circleStream;
      await circleHiddenVideo.play().catch(() => {});
    }

    document.getElementById('record-circle-btn').addEventListener('click', async () => {
      if (!currentChatUid) return alert('Сначала откройте чат!');

      try {
        circleVideoDevices = await getCameraDevices();
        currentCircleDeviceIndex = 0;

        await startCircleCameraStream(circleVideoDevices[0]?.deviceId);
        
        drawCircleToCanvas();
        const canvasStream = circleCanvas.captureStream(30);
        
        const audioTrack = circleStream.getAudioTracks()[0];
        if (audioTrack) canvasStream.addTrack(audioTrack);

        document.getElementById('record-modal').classList.add('active');

        mediaRecorderCircle = new MediaRecorder(canvasStream, { mimeType: 'video/webm' });
        circleChunks = [];

        mediaRecorderCircle.ondataavailable = e => {
          if (e.data.size > 0) circleChunks.push(e.data);
        };

        mediaRecorderCircle.onstop = () => {
          cancelAnimationFrame(circleCanvasAnimFrame);
          const blob = new Blob(circleChunks, { type: 'video/webm' });
          const now = new Date();
          const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

          const reader = new FileReader();
          reader.onload = (evt) => {
            const circleMsg = {
              id: 'circle-' + Date.now() + '-' + Math.random().toString(36).substring(2, 6),
              senderUid: myProfile.uid,
              senderName: myProfile.username,
              targetUid: currentChatUid,
              isGroup: isCurrentGroup,
              type: 'circle',
              content: evt.target.result,
              timestamp: timeStr
            };
            
            appendMessageToUI(circleMsg);
            saveMessageToHistory(currentChatUid, circleMsg);
            socket.emit('chat message', circleMsg);
          };
          reader.readAsDataURL(blob);

          if (circleStream) circleStream.getTracks().forEach(t => t.stop());
          document.getElementById('record-modal').classList.remove('active');
        };

        mediaRecorderCircle.start(100);

        circleSeconds = 0;
        const circleRecTimer = document.getElementById('circle-rec-timer');
        circleRecTimer.textContent = "00:00";
        circleTimerInterval = setInterval(() => {
          circleSeconds++;
          circleRecTimer.textContent = formatTime(circleSeconds);
        }, 1000);

      } catch (err) {
        alert('Не удалось получить доступ к камере или микрофону');
      }
    });

    document.getElementById('switch-circle-cam-btn').addEventListener('click', async () => {
      if (circleVideoDevices.length < 2) {
        circleVideoDevices = await getCameraDevices();
        if (circleVideoDevices.length < 2) return alert('На устройстве найдена только одна камера.');
      }

      currentCircleDeviceIndex = (currentCircleDeviceIndex + 1) % circleVideoDevices.length;
      const nextDeviceId = circleVideoDevices[currentCircleDeviceIndex].deviceId;

      await startCircleCameraStream(nextDeviceId);
    });

    document.getElementById('cancel-record-btn').addEventListener('click', () => {
      clearInterval(circleTimerInterval);
      cancelAnimationFrame(circleCanvasAnimFrame);
      if (mediaRecorderCircle && mediaRecorderCircle.state !== 'inactive') {
        mediaRecorderCircle.onstop = null;
        mediaRecorderCircle.stop();
      }
      if (circleStream) circleStream.getTracks().forEach(t => t.stop());
      document.getElementById('record-modal').classList.remove('active');
    });

    document.getElementById('stop-record-btn').addEventListener('click', () => {
      clearInterval(circleTimerInterval);
      if (mediaRecorderCircle && mediaRecorderCircle.state === 'recording') {
        mediaRecorderCircle.stop();
      }
    });

    // ==========================================
    // WEBRTC И ЗВОНКИ (Демонстрация и выбор устройств)
    // ==========================================
    let peerConnections = {};
    let localStream = null;
    let screenStream = null;
    let incomingOfferData = null;
    let callVideoDevices = [];
    let currentCallDeviceIndex = 0;

    const callModal = document.getElementById('call-modal');
    const localVideo = document.getElementById('local-video');
    const videoGrid = document.getElementById('video-grid');

    const toggleMicBtn = document.getElementById('toggle-mic-btn');
    const toggleCamBtn = document.getElementById('toggle-cam-btn');
    const acceptCallBtn = document.getElementById('accept-call-btn');
    const shareScreenBtn = document.getElementById('share-screen-btn');

    toggleMicBtn.addEventListener('click', () => {
      if (localStream) {
        const audioTrack = localStream.getAudioTracks()[0];
        if (audioTrack) {
          audioTrack.enabled = !audioTrack.enabled;
          toggleMicBtn.textContent = audioTrack.enabled ? '🎤 Вкл' : '🎤 Выкл';
          toggleMicBtn.classList.toggle('off', !audioTrack.enabled);
        }
      }
    });

    toggleCamBtn.addEventListener('click', () => {
      if (localStream) {
        const videoTrack = localStream.getVideoTracks()[0];
        if (videoTrack) {
          videoTrack.enabled = !videoTrack.enabled;
          toggleCamBtn.textContent = videoTrack.enabled ? '📷 Вкл' : '📷 Выкл';
          toggleCamBtn.classList.toggle('off', !videoTrack.enabled);
        }
      }
    });

    document.getElementById('switch-cam-btn').addEventListener('click', async () => {
      if (!localStream) return;

      try {
        callVideoDevices = await getCameraDevices();
        if (callVideoDevices.length < 2) {
          return alert('На вашем устройстве только одна видеокамера');
        }

        currentCallDeviceIndex = (currentCallDeviceIndex + 1) % callVideoDevices.length;
        const nextDeviceId = callVideoDevices[currentCallDeviceIndex].deviceId;

        const newStream = await navigator.mediaDevices.getUserMedia({
          video: { deviceId: { exact: nextDeviceId } }
        });
        
        const newVideoTrack = newStream.getVideoTracks()[0];
        const oldVideoTrack = localStream.getVideoTracks()[0];

        if (oldVideoTrack) {
          localStream.removeTrack(oldVideoTrack);
          oldVideoTrack.stop();
        }

        localStream.addTrack(newVideoTrack);
        localVideo.srcObject = localStream;

        Object.values(peerConnections).forEach(pc => {
          const senders = pc.getSenders();
          const videoSender = senders.find(s => s.track && s.track.kind === 'video');
          if (videoSender) {
            videoSender.replaceTrack(newVideoTrack);
          }
        });
      } catch (e) {
        alert('Ошибка при переключении камеры: ' + e.message);
      }
    });

    shareScreenBtn.addEventListener('click', async () => {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
        return alert('Ваш браузер или устройство не поддерживает демонстрацию экрана.');
      }

      if (!screenStream) {
        try {
          screenStream = await navigator.mediaDevices.getDisplayMedia({
            video: { cursor: "always" },
            audio: false
          });

          const screenTrack = screenStream.getVideoTracks()[0];
          localVideo.srcObject = screenStream;

          Object.values(peerConnections).forEach(pc => {
            const senders = pc.getSenders();
            const videoSender = senders.find(s => s.track && s.track.kind === 'video');
            if (videoSender) {
              videoSender.replaceTrack(screenTrack);
            }
          });

          shareScreenBtn.textContent = '🖥️ Стоп экран';
          shareScreenBtn.classList.add('danger');

          screenTrack.onended = () => {
            stopScreenSharing();
          };
        } catch (err) {
          if (err.name !== 'NotAllowedError') {
            alert('Не удалось запустить трансляцию экрана: ' + err.message);
          }
        }
      } else {
        stopScreenSharing();
      }
    });

    function stopScreenSharing() {
      if (screenStream) {
        screenStream.getTracks().forEach(t => t.stop());
        screenStream = null;
      }

      if (localStream) {
        const videoTrack = localStream.getVideoTracks()[0];
        localVideo.srcObject = localStream;

        Object.values(peerConnections).forEach(pc => {
          const senders = pc.getSenders();
          const videoSender = senders.find(s => s.track && s.track.kind === 'video');
          if (videoSender && videoTrack) {
            videoSender.replaceTrack(videoTrack);
          }
        });
      }

      shareScreenBtn.textContent = '🖥️ Экран';
      shareScreenBtn.classList.remove('danger');
    }

    async function initLocalStream() {
      if (!localStream) {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        localVideo.srcObject = localStream;
      }
    }

    document.getElementById('start-call-btn').addEventListener('click', async () => {
      if (!currentChatUid) return;

      await initLocalStream();
      callModal.classList.add('active');
      acceptCallBtn.style.display = 'none';

      if (isCurrentGroup) {
        const groupObj = myGroups.find(g => g.id === currentChatUid);
        const members = groupObj ? groupObj.members : [];

        for (const memberUid of members) {
          if (memberUid !== myProfile.uid) {
            const pc = createPeerConnection(memberUid);
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            socket.emit('call-user', {
              senderUid: myProfile.uid,
              targetUid: memberUid,
              isGroup: true,
              offer: offer
            });
          }
        }
      } else {
        const pc = createPeerConnection(currentChatUid);
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        socket.emit('call-user', {
          senderUid: myProfile.uid,
          targetUid: currentChatUid,
          isGroup: false,
          offer: offer
        });
      }
    });

    socket.on('incoming-call', async (data) => {
      incomingOfferData = data;
      
      if (customRingtone) {
        ringtoneAudio.loop = true;
        ringtoneAudio.play().catch(() => {});
      }

      document.getElementById('call-username').textContent = `${data.fromName} (${data.isGroup ? 'Групповой входящий...' : 'Входящий...'})`;
      acceptCallBtn.style.display = 'flex';
      callModal.classList.add('active');
    });

    acceptCallBtn.addEventListener('click', async () => {
      acceptCallBtn.style.display = 'none';

      ringtoneAudio.pause();
      ringtoneAudio.currentTime = 0;

      await initLocalStream();

      const pc = createPeerConnection(incomingOfferData.fromUid);
      await pc.setRemoteDescription(new RTCSessionDescription(incomingOfferData.offer));

      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);

      socket.emit('make-answer', {
        targetUid: incomingOfferData.fromUid,
        isGroup: incomingOfferData.isGroup,
        answer: answer
      });
    });

    socket.on('call-answered', async (data) => {
      const pc = peerConnections[data.fromUid];
      if (pc) {
        await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
      }
    });

    socket.on('ice-candidate', async (data) => {
      const pc = peerConnections[data.fromUid];
      if (pc && data.candidate) {
        await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
      }
    });

    document.getElementById('end-call-btn').addEventListener('click', endCall);

    socket.on('call-ended', (data) => {
      if (data.fromUid && peerConnections[data.fromUid]) {
        removeRemoteVideo(data.fromUid);
        peerConnections[data.fromUid].close();
        delete peerConnections[data.fromUid];
      }
      if (Object.keys(peerConnections).length === 0) {
        endCall();
      }
    });

    function endCall() {
      ringtoneAudio.pause();
      ringtoneAudio.currentTime = 0;

      if (screenStream) stopScreenSharing();

      socket.emit('end-call', { targetUid: currentChatUid, isGroup: isCurrentGroup });

      Object.keys(peerConnections).forEach(uid => {
        peerConnections[uid].close();
        removeRemoteVideo(uid);
      });
      peerConnections = {};

      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }

      callModal.classList.remove('active');
    }

    function createPeerConnection(remoteUid) {
      if (peerConnections[remoteUid]) {
        return peerConnections[remoteUid];
      }

      const pc = new RTCPeerConnection({
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      });

      peerConnections[remoteUid] = pc;

      if (localStream) {
        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
      }

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit('ice-candidate', {
            targetUid: remoteUid,
            isGroup: isCurrentGroup,
            candidate: event.candidate
          });
        }
      };

      pc.ontrack = (event) => {
        addRemoteVideo(remoteUid, event.streams[0]);
      };

      return pc;
    }

    function addRemoteVideo(remoteUid, stream) {
      let card = document.getElementById(`video-card-${remoteUid}`);
      if (!card) {
        card = document.createElement('div');
        card.className = 'video-card';
        card.id = `video-card-${remoteUid}`;

        const video = document.createElement('video');
        video.autoplay = true;
        video.playsinline = true;
        video.srcObject = stream;

        let name = 'Собеседник';
        const foundContact = contacts.find(c => c.uid === remoteUid);
        if (foundContact) name = foundContact.name;

        const label = document.createElement('div');
        label.className = 'user-label';
        label.textContent = name;

        card.appendChild(video);
        card.appendChild(label);
        videoGrid.appendChild(card);
      } else {
        const video = card.querySelector('video');
        if (video) video.srcObject = stream;
      }
    }

    function removeRemoteVideo(remoteUid) {
      const card = document.getElementById(`video-card-${remoteUid}`);
      if (card) card.remove();
    }

    function escapeHTML(str) {
      return (str || '').replace(/[&<>'"]/g, tag => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;'
      }[tag] || tag));
    }
  </script>
</body>
