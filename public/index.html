<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Khram Messenger</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0e1621; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Шапка */
        header { background: #17212b; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #0b1118; box-shadow: 0 2px 5px rgba(0,0,0,0.3); z-index: 10; }
        header .title { font-size: 18px; font-weight: bold; color: #5288c1; display: flex; align-items: center; gap: 8px; }
        .call-btn-head { background: #2b5278; border: none; padding: 8px 16px; border-radius: 20px; color: white; font-weight: 500; cursor: pointer; transition: 0.2s; }
        .call-btn-head:hover { background: #366593; }

        /* Окно видеозвонка */
        #call-section { display: none; background: #17212b; padding: 15px; flex-direction: column; align-items: center; gap: 12px; border-bottom: 2px solid #2b5278; animation: slideDown 0.3s ease; }
        .video-grid { display: flex; gap: 10px; width: 100%; justify-content: center; }
        video.stream-box { width: 48%; max-height: 220px; background: #0e1621; border-radius: 12px; object-fit: cover; border: 1px solid #2b5278; }
        .call-controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

        /* Зона сообщений */
        #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #0e1621; }
        .msg-row { display: flex; flex-direction: column; max-width: 75%; background: #182533; padding: 10px 14px; border-radius: 14px 14px 14px 2px; word-break: break-word; font-size: 15px; line-height: 1.4; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        .msg-row.my { align-self: flex-end; background: #2b5278; border-radius: 14px 14px 2px 14px; }
        .msg-row img { max-width: 100%; border-radius: 8px; margin-top: 6px; cursor: pointer; }
        
        /* Видео-кружочки */
        .circle-video { width: 200px; height: 200px; border-radius: 50%; object-fit: cover; border: 3px solid #5288c1; margin-top: 5px; }

        /* Нижняя панель */
        .panel { background: #17212b; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #0b1118; }
        .media-actions { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
        .media-actions::-webkit-scrollbar { display: none; }
        
        .input-row { display: flex; gap: 8px; align-items: center; }
        input[type="text"] { flex: 1; background: #0e1621; border: 1px solid #242f3d; padding: 12px 16px; border-radius: 22px; color: white; font-size: 15px; outline: none; }
        input[type="text"]:focus { border-color: #5288c1; }

        button { border: none; border-radius: 20px; padding: 9px 15px; background: #242f3d; color: white; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; transition: 0.2s; }
        button:hover { background: #2b5278; }
        button.primary { background: #5288c1; font-weight: bold; }
        button.primary:hover { background: #649ad3; }
        button.danger { background: #e53935; }
        button.danger:hover { background: #d32f2f; }
        button.recording { background: #e53935; animation: pulse 1s infinite; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        @keyframes slideDown { from { transform: translateY(-100%); } to { transform: translateY(0); } }
    </style>
</head>
<body>

    <header>
        <div class="title">💬 Khram Messenger</div>
        <button class="call-btn-head" onclick="toggleCallPanel()">📞 Звонок</button>
    </header>

    <!-- Панель видеозвонка -->
    <div id="call-section">
        <div class="video-grid">
            <video id="local-video" autoplay playsinline muted class="stream-box"></video>
            <video id="remote-video" autoplay playsinline class="stream-box"></video>
        </div>
        <div class="call-controls">
            <button class="primary" onclick="startCall()">📞 Начать звонок</button>
            <button id="mic-btn" onclick="toggleMic()">🎙️ Мик: Вкл</button>
            <button id="cam-btn" onclick="toggleCam()">📹 Камера: Вкл</button>
            <button onclick="switchCamera()">🔄 Камера</button>
            <button class="danger" onclick="endCall()">❌ Завершить</button>
        </div>
    </div>

    <!-- Область чата -->
    <div id="chat-container"></div>

    <!-- Нижняя панель с кнопками и вводом -->
    <div class="panel">
        <div class="media-actions">
            <input type="file" id="file-input" style="display: none;" onchange="sendFile(this)">
            <button onclick="document.getElementById('file-input').click()">📁 Файл / Фото</button>
            <button id="rec-audio-btn" onclick="toggleAudioRecord()">🎙️ ГС</button>
            <button id="rec-circle-btn" onclick="toggleCircleRecord()">⭕ Кружочек</button>
        </div>
        <div class="input-row">
            <input type="text" id="message-input" placeholder="Напишите сообщение..." onkeypress="if(event.key==='Enter') sendTextMessage()">
            <button class="primary" onclick="sendTextMessage()">Отправить</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
                </html>
