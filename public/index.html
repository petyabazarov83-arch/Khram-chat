<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Храм</title>
  <style>
    :root {
      --bg-main: #0b0e14;
      --bg-panel: #161b22;
      --border-color: #30363d;
      --text-main: #e6edf3;
      --text-muted: #8b949e;
      --brand-color: #f59e0b;
      --msg-mine-bg: #27272a;
      --msg-other-bg: #1e293b;
    }

    body.light-theme {
      --bg-main: #f3f4f6;
      --bg-panel: #ffffff;
      --border-color: #e5e7eb;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --msg-mine-bg: #dbeafe;
      --msg-other-bg: #f3f4f6;
    }

    * { box-sizing: border-box; }
    html, body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 0;
      height: 100%; width: 100%;
      overflow: hidden;
    }
    #app { display: flex; flex-direction: column; height: 100vh; height: -webkit-fill-available; }

    header {
      background: var(--bg-panel); padding: 10px 16px; display: flex;
      justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color);
    }
    .brand { display: flex; align-items: center; gap: 8px; }
    .brand h1 { margin: 0; font-size: 18px; color: var(--brand-color); font-weight: bold; letter-spacing: 2px; }

    .nav-tabs { display: flex; background: var(--bg-panel); border-bottom: 1px solid var(--border-color); }
    .tab-btn {
      flex: 1; padding: 12px; background: none; border: none;
      color: var(--text-muted); font-weight: bold; cursor: pointer; border-bottom: 2px solid transparent;
    }
    .tab-btn.active { color: var(--brand-color); border-bottom-color: var(--brand-color); }

    .page { display: none; flex: 1; flex-direction: column; overflow: hidden; }
    .page.active { display: flex; }

    .profile-card {
      padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; overflow-y: auto;
    }
    .avatar-preview {
      width: 90px; height: 90px; border-radius: 50%; object-fit: cover;
      background: #1f6beb; border: 3px solid var(--brand-color); display: flex;
      align-items: center; justify-content: center; font-size: 36px; color: #fff; overflow: hidden;
    }
    .input-field {
      width: 100%; max-width: 320px; padding: 10px 14px; background: var(--bg-panel);
      border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); font-size: 14px; outline: none;
    }
    .uid-box {
      background: var(--bg-panel); border: 1px solid var(--border-color); padding: 10px 14px;
      border-radius: 8px; font-family: monospace; color: var(--brand-color); width: 100%; max-width: 320px; text-align: center;
    }

    #chat-list { flex: 1; overflow-y: auto; }
    .chat-item {
      padding: 12px 16px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center;
      gap: 12px; cursor: pointer;
    }
    .chat-item:hover { background: var(--bg-panel); }
    .chat-avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: #21262d; display: flex; align-items: center; justify-content: center; font-weight: bold; overflow: hidden; flex-shrink: 0; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #6e7681; display: inline-block; margin-right: 6px; }
    .status-dot.online { background: #22c55e; }

    #messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; background-size: cover; background-position: center; }

    .bg-preset-1 { background: linear-gradient(135deg, #0f172a, #1e293b); }
    .bg-preset-2 { background: linear-gradient(135deg, #18181b, #27272a); }
    .bg-preset-3 { background: linear-gradient(135deg, #022c22, #064e3b); }
    .bg-preset-4 { background: linear-gradient(135deg, #311042, #581c87); }

    .msg {
      max-width: 80%; padding: 8px 12px; border-radius: 12px; font-size: 14px; word-break: break-word;
      display: flex; flex-direction: column; position: relative; color: var(--text-main);
    }
    .msg.mine { align-self: flex-end; background: var(--msg-mine-bg); border: 1px solid var(--border-color); }
    .msg.other { align-self: flex-start; background: var(--msg-other-bg); border: 1px solid var(--border-color); }
    .msg-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 11px; color: var(--brand-color); font-weight: bold; margin-bottom: 4px; }
    .msg-time { font-size: 10px; color: var(--text-muted); font-weight: normal; }
    .delete-btn { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 12px; padding: 0; }

    .video-circle {
      width: 180px; height: 180px; border-radius: 50%; object-fit: cover;
      border: 3px solid var(--brand-color); margin-top: 4px; display: block;
    }

    #controls { background: var(--bg-panel); padding: 8px; border-top: 1px solid var(--border-color); }
    .input-row { display: flex; align-items: center; gap: 6px; }
    #input { flex: 1; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: 20px; background: var(--bg-main); color: var(--text-main); font-size: 14px; outline: none; }
    .btn-icon { background: var(--bg-panel); border: 1px solid var(--border-color); color: var(--text-main); width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; flex-shrink: 0; user-select: none; }
    .btn-icon.active-rec { background: #ef4444; color: white; animation: pulse 1s infinite; }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .btn-send { background: var(--brand-color); border: none; color: #000; font-weight: bold; }

    #call-modal {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #0d1117;
      flex-direction: column; align-items: center; justify-content: space-between; padding: 20px 10px; z-index: 1000;
    }
    .video-container { position: relative; width: 100%; max-width: 450px; flex: 1; background: #161b22; border-radius: 16px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    #remote-video { width: 100%; height: 100%; object-fit: cover; }
    #local-video { position: absolute; bottom: 12px; right: 12px; width: 100px; height: 140px; border-radius: 10px; object-fit: cover; border: 2px solid var(--brand-color); background: #000; }
    
    .call-controls { display: flex; gap: 8px; margin-top: 15px; flex-wrap: wrap; justify-content: center; }
    .call-btn { background: #22c55e; border: none; color: white; padding: 10px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 13px; }
    .call-btn.off { background: #ef4444; }
    .call-btn.danger { background: #ef4444; }

    #record-modal {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85);
      flex-direction: column; align-items: center; justify-content: center; gap: 15px; z-index: 1000;
    }
    #circle-preview { width: 220px; height: 220px; border-radius: 50%; border: 4px solid var(--brand-color); object-fit: cover; background: #000; }
  </style>
</head>
<body>

  <div id="app">
    <header>
      <div class="brand">
        <span>✨</span>
        <h1 id="brand-title">ХРАМ</h1>
      </div>
      <div>
        <button class="btn-icon" id="create-group-btn" title="Создать групповой чат">👥+</button>
        <button class="btn-icon" id="sync-sim-btn" title="Импорт контактов по номерам">📱+</button>
      </div>
    </header>

    <div class="nav-tabs">
      <button class="tab-btn active" id="tab-btn-chats">Чаты</button>
      <button class="tab-btn" id="tab-btn-profile">Профиль</button>
      <button class="tab-btn" id="tab-btn-settings">Настройки</button>
    </div>

    <!-- Чаты -->
    <div id="chats-page" class="page active">
      <div id="chat-list">
        <div class="chat-item" id="bot-chat-item">
          <div class="chat-avatar">🤖</div>
          <div>
            <strong>ИИ Помощник 🤖</strong>
            <div style="font-size:12px; color:var(--text-muted);">Помощник чата</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Профиль -->
    <div id="profile-page" class="page">
      <div class="profile-card">
        <div id="avatar-display" class="avatar-preview">👤</div>
        <label style="color:var(--brand-color); cursor:pointer; font-size:13px;">
          Загрузить аватарку
          <input type="file" id="avatar-input" accept="image/*" style="display:none;">
        </label>

        <div style="width:100%; max-width:320px;">
          <label style="font-size:12px; color:var(--text-muted);">Ваше имя / Ник:</label>
          <input id="username-input" class="input-field" placeholder="Введите имя..." />
        </div>

        <div style="width:100%; max-width:320px;">
          <label style="font-size:12px; color:var(--text-muted);">Ваш номер телефона:</label>
          <input id="phone-input" class="input-field" placeholder="+7 999 000 00 00" />
        </div>

        <button class="call-btn" id="save-profile-btn" style="width:100%; max-width:320px; justify-content:center;">Сохранить профиль</button>

        <div style="font-size: 13px; color: var(--text-muted); margin-top:10px;">ВАШ UID:</div>
        <div class="uid-box" id="my-uid">Загрузка...</div>
      </div>
    </div>

    <!-- Настройки -->
    <div id="settings-page" class="page">
      <div class="profile-card">
        <h3>🎨 Тема оформления</h3>
        <select id="theme-select" class="input-field">
          <option value="dark">Тёмная тема</option>
          <option value="light">Светлая тема</option>
        </select>

        <h3>🎨 Цвет названия «ХРАМ»</h3>
        <select id="brand-color-select" class="input-field">
          <option value="#f59e0b">Янтарный (По умолчанию)</option>
          <option value="#ef4444">Красный</option>
          <option value="#22c55e">Зеленый</option>
          <option value="#3b82f6">Синий</option>
          <option value="#a855f7">Фиолетовый</option>
        </select>

        <h3>🎵 Рингтон звонков</h3>
        <input type="file" id="ringtone-input" accept="audio/*" class="input-field">
        <div id="ringtone-status" style="font-size:12px; color:#22c55e; margin-top:4px;"></div>
      </div>
    </div>

    <!-- Чат окно -->
    <div id="chat-window-modal" class="page">
      <div id="chat-header" style="background:var(--bg-panel); padding:8px 16px; border-bottom:1px solid var(--border-color); display:flex; justify-content:space-between; align-items:center;">
        <button class="btn-icon" id="close-chat-btn">←</button>
        <div style="display:flex; align-items:center; gap:10px;">
          <div id="active-chat-avatar" class="chat-avatar" style="width:36px; height:36px;">👤</div>
          <div>
            <strong id="active-chat-title">Чат</strong>
            <div id="active-chat-status" style="font-size:11px; color:var(--text-muted);">⚪ Офлайн</div>
          </div>
        </div>
        <div style="display:flex; gap:6px;">
          <button class="btn-icon" id="bg-settings-btn" title="Фон чата">🖼️</button>
          <button class="call-btn" id="start-call-btn">📞 Звонок</button>
        </div>
      </div>

      <div id="messages"></div>

      <div id="controls">
        <div class="input-row">
          <label class="btn-icon" title="Отправить файл/фото">
            📎<input type="file" id="file-input" style="display:none;" accept="*/*">
          </label>
          <button class="btn-icon" id="record-audio-btn" title="Голосовое сообщение">🎤</button>
          <button class="btn-icon" id="record-circle-btn" title="Видеокружочек">⭕</button>
          <input id="input" autocomplete="off" placeholder="Сообщение..." />
          <button class="btn-icon btn-send" id="send-btn">➔</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Окно звонка -->
  <div id="call-modal">
    <div id="call-user-info" style="color:#fff; font-size:18px; font-weight:bold; margin-bottom:10px; display:flex; align-items:center; gap:10px;">
      <div id="call-avatar" class="chat-avatar" style="width:40px; height:40px;">👤</div>
      <span id="call-username">Звонок...</span>
    </div>

    <div class="video-container">
      <video id="remote-video" autoplay playsinline></video>
      <video id="local-video" autoplay playsinline muted></video>
    </div>

    <div class="call-controls">
      <button id="toggle-mic-btn" class="call-btn">🎙 Микрофон</button>
      <button id="toggle-cam-btn" class="call-btn">📷 Камера</button>
      <button id="switch-cam-btn" class="call-btn">🔄 Камера</button>
      <button id="accept-call-btn" class="call-btn" style="display:none;">Ответить</button>
      <button id="end-call-btn" class="call-btn danger">Завершить</button>
    </div>
  </div>

  <!-- Запись кружка -->
  <div id="record-modal">
    <video id="circle-preview" autoplay playsinline muted></video>
    <div style="display:flex; gap:10px;">
      <button class="call-btn danger" id="cancel-record-btn">Отмена</button>
      <button class="call-btn" id="stop-record-btn">Отправить</button>
    </div>
  </div>

  <audio id="custom-ringtone" loop></audio>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let swRegistration = null;
    let callTimeoutTimer = null;

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').then(reg => {
        swRegistration = reg;
      });

      navigator.serviceWorker.addEventListener('message', event => {
        if (event.data && event.data.action === 'accept_incoming_call') {
          acceptCallAction();
        }
      });
    }

    if ('Notification' in window && Notification.permission !== 'granted') {
      Notification.requestPermission();
    }

    function sendCallNotification(callerName, callerAvatar) {
      if (swRegistration && Notification.permission === 'granted') {
        swRegistration.showNotification(`Входящий звонок от ${callerName}`, {
          body: 'Нажмите «Ответить», чтобы принять вызов',
          icon: callerAvatar || '',
          tag: 'incoming-call',
          renotify: true,
          requireInteraction: true,
          actions: [
            { action: 'accept_call', title: '📞 Ответить' }
          ]
        });
      }
    }

    const dbReq = indexedDB.open("KhramMediaDB", 1);
    let db = null;
    dbReq.onupgradeneeded = e => {
      db = e.target.result;
      if (!db.objectStoreNames.contains("ringtones")) db.createObjectStore("ringtones");
    };
    dbReq.onsuccess = e => {
      db = e.target.result;
      loadSavedRingtone();
    };

    function saveRingtoneToDB(dataUrl) {
      if (!db) return;
      const tx = db.transaction("ringtones", "readwrite");
      tx.objectStore("ringtones").put(dataUrl, "userRingtone");
    }

    function loadSavedRingtone() {
      if (!db) return;
      const tx = db.transaction("ringtones", "readonly");
      const req = tx.objectStore("ringtones").get("userRingtone");
      req.onsuccess = () => {
        if (req.result) {
          const ringtoneAudio = document.getElementById('custom-ringtone');
          ringtoneAudio.src = req.result;
          document.getElementById('ringtone-status').textContent = '🎵 Выбранный рингтон сохранён';
        }
      };
    }

    let myProfile = {
      uid: localStorage.getItem('khram_uid') || ('khram-user-' + Math.random().toString(36).substring(2, 8)),
      username: localStorage.getItem('khram_username') || 'Путник',
      avatar: localStorage.getItem('khram_avatar') || '',
      phone: localStorage.getItem('khram_phone') || ''
    };
    localStorage.setItem('khram_uid', myProfile.uid);

    document.getElementById('my-uid').textContent = myProfile.uid;
    document.getElementById('username-input').value = myProfile.username;
    document.getElementById('phone-input').value = myProfile.phone;

    const savedTheme = localStorage.getItem('khram_theme') || 'dark';
    if (savedTheme === 'light') document.body.classList.add('light-theme');
    document.getElementById('theme-select').value = savedTheme;

    const savedBrandColor = localStorage.getItem('khram_brand_color') || '#f59e0b';
    document.documentElement.style.setProperty('--brand-color', savedBrandColor);
    document.getElementById('brand-color-select').value = savedBrandColor;

    document.getElementById('theme-select').addEventListener('change', (e) => {
      const theme = e.target.value;
      localStorage.setItem('khram_theme', theme);
      if (theme === 'light') document.body.classList.add('light-theme');
      else document.body.classList.remove('light-theme');
    });

    document.getElementById('brand-color-select').addEventListener('change', (e) => {
      const color = e.target.value;
      localStorage.setItem('khram_brand_color', color);
      document.documentElement.style.setProperty('--brand-color', color);
    });

    function updateMyAvatarDisplay() {
      if (myProfile.avatar) {
        document.getElementById('avatar-display').innerHTML = `<img src="${myProfile.avatar}" style="width:100%;height:100%;object-fit:cover;">`;
      }
    }
    updateMyAvatarDisplay();

    socket.on('connect', () => {
      socket.emit('register', myProfile);
    });

    function saveProfile() {
      myProfile.username = document.getElementById('username-input').value.trim() || 'Путник';
      myProfile.phone = document.getElementById('phone-input').value.trim().replace(/\D/g, '');
      localStorage.setItem('khram_username', myProfile.username);
      localStorage.setItem('khram_phone', myProfile.phone);
      socket.emit('register', myProfile);
      alert('Профиль сохранен!');
    }
    document.getElementById('save-profile-btn').addEventListener('click', saveProfile);

    document.getElementById('avatar-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          myProfile.avatar = evt.target.result;
          localStorage.setItem('khram_avatar', myProfile.avatar);
          updateMyAvatarDisplay();
          socket.emit('register', myProfile);
        };
        reader.readAsDataURL(file);
      }
    });

    document.getElementById('sync-sim-btn').addEventListener('click', () => {
      const inputPhones = prompt('Введите номера телефонов для поиска (через запятую):');
      if (inputPhones) {
        const phoneArray = inputPhones.split(',').map(p => p.trim());
        socket.emit('sync-contacts', phoneArray);
      }
    });

    socket.on('contacts-synced', (foundContacts) => {
      let addedCount = 0;
      foundContacts.forEach(fc => {
        if (fc.uid !== myProfile.uid && !contacts.some(c => c.uid === fc.uid)) {
          contacts.push({ uid: fc.uid, name: fc.name, avatar: fc.avatar });
          addedCount++;
        }
      });
      localStorage.setItem('khram_contacts', JSON.stringify(contacts));
      renderContacts();
      alert(`Найдено и добавлено контактов: ${addedCount}`);
    });

    const ringtoneAudio = document.getElementById('custom-ringtone');
    let audioCtx = null, synthInterval = null;

    function playSystemRingtone() {
      if (ringtoneAudio.src) {
        ringtoneAudio.currentTime = 0;
        ringtoneAudio.play().catch(e => console.log('Ошибка проигрывания рингтона:', e));
        return;
      }
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      
      function pulse() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.8);
      }
      pulse();
      synthInterval = setInterval(pulse, 1600);
    }

    function stopSystemRingtone() {
      if (ringtoneAudio.src) {
        ringtoneAudio.pause();
        ringtoneAudio.currentTime = 0;
      }
      if (synthInterval) clearInterval(synthInterval);
    }

    document.getElementById('ringtone-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          saveRingtoneToDB(evt.target.result);
          ringtoneAudio.src = evt.target.result;
          document.getElementById('ringtone-status').textContent = '🎵 Рингтон сохранен!';
        };
        reader.readAsDataURL(file);
      }
    });

    function switchTab(pageId, targetBtn) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
      if (targetBtn) targetBtn.classList.add('active');
    }

    document.getElementById('tab-btn-chats').addEventListener('click', (e) => switchTab('chats-page', e.target));
    document.getElementById('tab-btn-profile').addEventListener('click', (e) => switchTab('profile-page', e.target));
    document.getElementById('tab-btn-settings').addEventListener('click', (e) => switchTab('settings-page', e.target));

    let contacts = JSON.parse(localStorage.getItem('khram_contacts') || '[]');
    let myGroups = JSON.parse(localStorage.getItem('khram_groups') || '[]');
    let activeOnlineUids = [];

    function renderContacts() {
      const chatList = document.getElementById('chat-list');
      chatList.querySelectorAll('.dynamic-item').forEach(el => el.remove());

      myGroups.forEach(g => {
        const div = document.createElement('div');
        div.className = 'chat-item dynamic-item';
        div.addEventListener('click', () => openChat(g.id, g.name, '', true));
        div.innerHTML = `
          <div class="chat-avatar" style="background:#f59e0b; color:#000;">👥</div>
          <div>
            <strong>${g.name}</strong>
            <div style="font-size:12px; color:var(--text-muted);">Групповой чат</div>
          </div>
        `;
        chatList.appendChild(div);
      });

      contacts.forEach(c => {
        const isOnline = activeOnlineUids.includes(c.uid);
        const div = document.createElement('div');
        div.className = 'chat-item dynamic-item';
        div.addEventListener('click', () => openChat(c.uid, c.name, c.avatar, false));
        div.innerHTML = `
          <div class="chat-avatar">${c.avatar ? `<img src="${c.avatar}" style="width:100%;height:100%;object-fit:cover;">` : '👤'}</div>
          <div>
            <strong>${c.name}</strong>
            <div style="font-size:12px; color:var(--text-muted);">
              <span class="status-dot ${isOnline ? 'online' : ''}"></span>${isOnline ? 'Онлайн' : 'Офлайн'}
            </div>
          </div>
        `;
        chatList.appendChild(div);
      });
    }

    document.getElementById('bot-chat-item').addEventListener('click', () => openChat('bot-assistant', 'ИИ Помощник 🤖', '', false));

    document.getElementById('create-group-btn').addEventListener('click', () => {
      const groupName = prompt('Введите название группы:');
      if (!groupName) return;

      const selectedUids = [];
      contacts.forEach(c => {
        if (confirm(`Добавить ${c.name} в группу?`)) {
          selectedUids.push(c.uid);
        }
      });

      socket.emit('create-group', { name: groupName, members: selectedUids, ownerUid: myProfile.uid });
    });

    socket.on('group-created', (groupData) => {
      if (!myGroups.some(g => g.id === groupData.id)) {
        myGroups.push(groupData);
        localStorage.setItem('khram_groups', JSON.stringify(myGroups));
        renderContacts();
      }
    });

    let currentChatUid = '', isCurrentGroup = false;

    function openChat(uid, title, avatar, isGroup = false) {
      currentChatUid = uid;
      isCurrentGroup = isGroup;

      document.getElementById('active-chat-title').textContent = title;
      const avatarContainer = document.getElementById('active-chat-avatar');
      avatarContainer.innerHTML = isGroup ? '👥' : (avatar ? `<img src="${avatar}" style="width:100%;height:100%;object-fit:cover;">` : '👤');

      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('chat-window-modal').classList.add('active');

      applyChatBackground();
      updateActiveChatStatus();
      loadHistory();
    }

    function closeChat() {
      document.getElementById('chat-window-modal').classList.remove('active');
      document.getElementById('chats-page').classList.add('active');
      currentChatUid = '';
      isCurrentGroup = false;
    }
    document.getElementById('close-chat-btn').addEventListener('click', closeChat);

    document.getElementById('bg-settings-btn').addEventListener('click', () => {
      if (isCurrentGroup) {
        const fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.accept = 'image/*';
        fileInput.onchange = (e) => {
          const file = e.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = (evt) => {
              const bgUrl = evt.target.result;
              socket.emit('update-group-bg', { groupId: currentChatUid, bgImage: bgUrl, userUid: myProfile.uid });
            };
            reader.readAsDataURL(file);
          }
        };
        fileInput.click();
      } else {
        const choice = prompt('Выберите фон (1, 2, 3, 4):');
        if (['1','2','3','4'].includes(choice)) {
          localStorage.setItem(`bg_chat_${currentChatUid}`, `bg-preset-${choice}`);
          applyChatBackground();
        }
      }
    });

    function applyChatBackground() {
      const msgBox = document.getElementById('messages');
      msgBox.style.backgroundImage = '';
      msgBox.className = '';

      if (isCurrentGroup) {
        const g = myGroups.find(group => group.id === currentChatUid);
        if (g && g.bgImage) msgBox.style.backgroundImage = `url(${g.bgImage})`;
      } else {
        const preset = localStorage.getItem(`bg_chat_${currentChatUid}`);
        if (preset) msgBox.classList.add(preset);
      }
    }

    function updateActiveChatStatus() {
      if (!currentChatUid) return;
      const statusEl = document.getElementById('active-chat-status');
      if (isCurrentGroup) {
        statusEl.textContent = 'Групповой чат';
        statusEl.style.color = 'var(--brand-color)';
      } else if (currentChatUid === 'bot-assistant') {
        statusEl.textContent = '🟢 Онлайн';
        statusEl.style.color = '#22c55e';
      } else {
        const isOnline = activeOnlineUids.includes(currentChatUid);
        statusEl.textContent = isOnline ? '🟢 Онлайн' : '⚪ Офлайн';
        statusEl.style.color = isOnline ? '#22c55e' : 'var(--text-muted)';
      }
    }

    function getHistoryKey(uid) {
      return `chat_history_${myProfile.uid}_${uid}`;
    }

    function loadHistory() {
      const messagesDiv = document.getElementById('messages');
      messagesDiv.innerHTML = '';
      const saved = JSON.parse(localStorage.getItem(getHistoryKey(currentChatUid)) || '[]');
      saved.forEach(msg => renderMessageUI(msg));
    }

    function saveMessageToHistory(msg) {
      const chatKey = msg.isGroup ? msg.targetUid : ((msg.senderUid === myProfile.uid) ? msg.targetUid : msg.senderUid);
      const key = getHistoryKey(chatKey);
      const saved = JSON.parse(localStorage.getItem(key) || '[]');
      if (!saved.some(m => m.id === msg.id)) {
        saved.push(msg);
        localStorage.setItem(key, JSON.stringify(saved));
      }
    }

    const messagesDiv = document.getElementById('messages');

    function renderMessageUI(data) {
      if (!data) return;
      const existingMsg = document.getElementById(`msg-${data.id}`);
      if (existingMsg) return;

      const isMine = data.senderUid === myProfile.uid;
      const div = document.createElement('div');
      div.className = `msg ${isMine ? 'mine' : 'other'}`;
      div.id = `msg-${data.id}`;

      const header = document.createElement('div');
      header.className = 'msg-header';
      header.innerHTML = `
        <span>${isMine ? 'Вы' : (data.senderName || 'Собеседник')} <span class="msg-time">${data.timestamp || ''}</span></span>
        ${isMine ? `<button class="delete-btn" onclick="deleteMessage('${data.id}')">🗑</button>` : ''}
      `;
      div.appendChild(header);

      const contentBox = document.createElement('div');
      contentBox.style.marginTop = '4px';

      if (data.type === 'text') {
        contentBox.textContent = data.content || '';
      } else if (data.type === 'image') {
        const img = document.createElement('img');
        img.src = data.content;
        img.style.maxWidth = '100%';
        img.style.borderRadius = '8px';
        contentBox.appendChild(img);
      } else if (data.type === 'audio') {
        const audio = document.createElement('audio');
        audio.src = data.content;
        audio.controls = true;
        audio.style.maxWidth = '220px';
        contentBox.appendChild(audio);
      } else if (data.type === 'circle') {
        const video = document.createElement('video');
        video.src = data.content;
        video.controls = true;
        video.autoplay = true;
        video.loop = true;
        video.muted = true;
        video.playsInline = true;
        video.className = 'video-circle';
        contentBox.appendChild(video);
      } else if (data.type === 'file') {
        const a = document.createElement('a');
        a.href = data.content;
        a.download = data.fileName || 'файл';
        a.style.color = 'var(--brand-color)';
        a.style.textDecoration = 'underline';
        a.textContent = `📁 ${data.fileName || 'Скачать файл'}`;
        contentBox.appendChild(a);
      }

      div.appendChild(contentBox);
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    socket.on('chat message', (data) => {
      saveMessageToHistory(data);
      const isForCurrentChat = isCurrentGroup 
        ? (data.targetUid === currentChatUid)
        : (data.senderUid === currentChatUid || data.targetUid === currentChatUid);

      if (currentChatUid && isForCurrentChat) {
        renderMessageUI(data);
      }
    });

    function deleteMessage(msgId) {
      socket.emit('delete message', { msgId, senderUid: myProfile.uid, targetUid: currentChatUid, isGroup: isCurrentGroup });
    }

    socket.on('message deleted', (data) => {
      const el = document.getElementById(`msg-${data.msgId}`);
      if (el) el.remove();
      const key = getHistoryKey(currentChatUid);
      let saved = JSON.parse(localStorage.getItem(key) || '[]');
      saved = saved.filter(m => String(m.id) !== String(data.msgId));
      localStorage.setItem(key, JSON.stringify(saved));
    });

    const input = document.getElementById('input');
    function sendText() {
      const text = input.value.trim();
      if (text && currentChatUid) {
        socket.emit('chat message', {
          senderUid: myProfile.uid,
          targetUid: currentChatUid,
          isGroup: isCurrentGroup,
          type: 'text',
          content: text
        });
        input.value = '';
      }
    }
    document.getElementById('send-btn').addEventListener('click', sendText);
    input.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendText(); });

    // Отправка файлов / фото
    document.getElementById('file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file || !currentChatUid) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        const isImg = file.type.startsWith('image/');
        socket.emit('chat message', {
          senderUid: myProfile.uid,
          targetUid: currentChatUid,
          isGroup: isCurrentGroup,
          type: isImg ? 'image' : 'file',
          content: evt.target.result,
          fileName: file.name,
          fileSize: file.size
        });
      };
      reader.readAsDataURL(file);
    });

    // Голосовые сообщения
    let audioRecorder, audioChunks = [], isAudioRecording = false;
    const recAudioBtn = document.getElementById('record-audio-btn');

    recAudioBtn.addEventListener('click', async () => {
      if (!currentChatUid) return alert('Выберите чат');

      if (!isAudioRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          audioRecorder = new MediaRecorder(stream);
          audioChunks = [];

          audioRecorder.ondataavailable = e => audioChunks.push(e.data);
          audioRecorder.onstop = () => {
            const blob = new Blob(audioChunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.onload = (evt) => {
              socket.emit('chat message', {
                senderUid: myProfile.uid,
                targetUid: currentChatUid,
                isGroup: isCurrentGroup,
                type: 'audio',
                content: evt.target.result
              });
            };
            reader.readAsDataURL(blob);
            stream.getTracks().forEach(t => t.stop());
          };

          audioRecorder.start();
          isAudioRecording = true;
          recAudioBtn.classList.add('active-rec');
        } catch(e) { alert('Ошибка доступа к микрофону'); }
      } else {
        audioRecorder.stop();
        isAudioRecording = false;
        recAudioBtn.classList.remove('active-rec');
      }
    });

    // Видеокружочки
    let circleStream, circleRecorder, circleChunks = [];
    const recordModal = document.getElementById('record-modal');
    const circlePreview = document.getElementById('circle-preview');

    document.getElementById('record-circle-btn').addEventListener('click', async () => {
      if (!currentChatUid) return alert('Выберите чат');
      try {
        circleStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: true });
        circlePreview.srcObject = circleStream;
        recordModal.style.display = 'flex';

        circleChunks = [];
        circleRecorder = new MediaRecorder(circleStream);
        circleRecorder.ondataavailable = e => circleChunks.push(e.data);
        circleRecorder.start();
      } catch(e) { alert('Ошибка доступа к камере'); }
    });

    document.getElementById('stop-record-btn').addEventListener('click', () => {
      if (circleRecorder && circleRecorder.state !== 'inactive') {
        circleRecorder.onstop = () => {
          const blob = new Blob(circleChunks, { type: 'video/webm' });
          const reader = new FileReader();
          reader.onload = (evt) => {
            socket.emit('chat message', {
              senderUid: myProfile.uid,
              targetUid: currentChatUid,
              isGroup: isCurrentGroup,
              type: 'circle',
              content: evt.target.result
            });
          };
          reader.readAsDataURL(blob);
          if (circleStream) circleStream.getTracks().forEach(t => t.stop());
        };
        circleRecorder.stop();
      }
      recordModal.style.display = 'none';
    });

    document.getElementById('cancel-record-btn').addEventListener('click', () => {
      if (circleStream) circleStream.getTracks().forEach(t => t.stop());
      recordModal.style.display = 'none';
    });

    // WebRTC Звонки
    let peerConnection, localStream;
    let currentFacingMode = 'user';
    const callModal = document.getElementById('call-modal');
    const remoteVideo = document.getElementById('remote-video');
    const localVideo = document.getElementById('local-video');
    const acceptCallBtn = document.getElementById('accept-call-btn');
    const toggleMicBtn = document.getElementById('toggle-mic-btn');
    const toggleCamBtn = document.getElementById('toggle-cam-btn');
    const switchCamBtn = document.getElementById('switch-cam-btn');
    let callTargetSocketId = null;

    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    async function setupCallMedia(facing = 'user') {
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      localStream = await navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: facing }, 
        audio: true 
      });
      localVideo.srcObject = localStream;
      currentFacingMode = facing;
      
      toggleMicBtn.classList.remove('off');
      toggleCamBtn.classList.remove('off');
    }

    toggleMicBtn.addEventListener('click', () => {
      if (localStream) {
        const audioTrack = localStream.getAudioTracks()[0];
        if (audioTrack) {
          audioTrack.enabled = !audioTrack.enabled;
          toggleMicBtn.classList.toggle('off', !audioTrack.enabled);
        }
      }
    });

    toggleCamBtn.addEventListener('click', () => {
      if (localStream) {
        const videoTrack = localStream.getVideoTracks()[0];
        if (videoTrack) {
          videoTrack.enabled = !videoTrack.enabled;
          toggleCamBtn.classList.toggle('off', !videoTrack.enabled);
        }
      }
    });

    switchCamBtn.addEventListener('click', async () => {
      const newFacing = (currentFacingMode === 'user') ? 'environment' : 'user';
      await setupCallMedia(newFacing);
      if (peerConnection) {
        const videoTrack = localStream.getVideoTracks()[0];
        const sender = peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
        if (sender && videoTrack) {
          sender.replaceTrack(videoTrack);
        }
      }
    });

    function startCallTimeout() {
      clearTimeout(callTimeoutTimer);
      callTimeoutTimer = setTimeout(() => {
        alert('Собеседник не ответил (Время ожидания истекло - 45 сек)');
        socket.emit('end-call', { targetUid: currentChatUid, reason: 'timeout' });
        closeCall();
      }, 45000);
    }

    document.getElementById('start-call-btn').addEventListener('click', async () => {
      if (!currentChatUid) return;
      callModal.style.display = 'flex';
      await setupCallMedia('user');

      peerConnection = new RTCPeerConnection(rtcConfig);
      localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));

      peerConnection.ontrack = e => { if (e.streams && e.streams[0]) remoteVideo.srcObject = e.streams[0]; };
      peerConnection.onicecandidate = e => { if (e.candidate) socket.emit('ice-candidate', { targetUid: currentChatUid, candidate: e.candidate }); };

      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);
      socket.emit('call-user', { targetUid: currentChatUid, senderUid: myProfile.uid, offer, isGroup: isCurrentGroup });

      startCallTimeout();
    });

    socket.on('incoming-call', async (data) => {
      callTargetSocketId = data.fromSocketId;
      document.getElementById('call-username').textContent = data.fromName || 'Входящий звонок';
      callModal.style.display = 'flex';
      acceptCallBtn.style.display = 'flex';

      playSystemRingtone();
      sendCallNotification(data.fromName || 'Собеседник', data.fromAvatar);

      window.incomingOffer = data.offer;
      startCallTimeout();
    });

    async function acceptCallAction() {
      clearTimeout(callTimeoutTimer);
      stopSystemRingtone();
      acceptCallBtn.style.display = 'none';
      await setupCallMedia('user');

      peerConnection = new RTCPeerConnection(rtcConfig);
      localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));

      peerConnection.ontrack = e => { if (e.streams && e.streams[0]) remoteVideo.srcObject = e.streams[0]; };
      peerConnection.onicecandidate = e => { if (e.candidate) socket.emit('ice-candidate', { toSocketId: callTargetSocketId, candidate: e.candidate }); };

      await peerConnection.setRemoteDescription(new RTCSessionDescription(window.incomingOffer));
      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);

      socket.emit('make-answer', { toSocketId: callTargetSocketId, answer });
    }

    acceptCallBtn.addEventListener('click', acceptCallAction);

    socket.on('call-answered', async (data) => {
      clearTimeout(callTimeoutTimer);
      if (peerConnection) {
        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
      }
    });

    socket.on('ice-candidate', async (data) => {
      if (peerConnection && data.candidate) {
        try { await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate)); } catch(e){}
      }
    });

    function closeCall() {
      clearTimeout(callTimeoutTimer);
      stopSystemRingtone();
      if (peerConnection) { peerConnection.close(); peerConnection = null; }
      if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
      remoteVideo.srcObject = null;
      localVideo.srcObject = null;
      callModal.style.display = 'none';
      acceptCallBtn.style.display = 'none';
    }

    document.getElementById('end-call-btn').addEventListener('click', () => {
      socket.emit('end-call', { targetUid: currentChatUid });
      closeCall();
    });

    socket.on('call-ended', closeCall);

    socket.on('online-users-list', (uids) => {
      activeOnlineUids = uids;
      renderContacts();
      updateActiveChatStatus();
    });

    renderContacts();
  </script>
</body>
  </html>
