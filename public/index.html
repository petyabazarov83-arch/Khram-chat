<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Храм</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      background-color: #0b0e14;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 0;
      height: 100%; width: 100%;
      overflow: hidden;
    }
    #app { display: flex; flex-direction: column; height: 100vh; height: -webkit-fill-available; }

    header {
      background: #161b22; padding: 10px 16px; display: flex;
      justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d;
    }
    .brand { display: flex; align-items: center; gap: 8px; }
    .brand h1 { margin: 0; font-size: 18px; color: #f59e0b; font-weight: bold; letter-spacing: 2px; }

    .nav-tabs { display: flex; background: #161b22; border-bottom: 1px solid #30363d; }
    .tab-btn {
      flex: 1; padding: 12px; background: none; border: none;
      color: #8b949e; font-weight: bold; cursor: pointer; border-bottom: 2px solid transparent;
    }
    .tab-btn.active { color: #f59e0b; border-bottom-color: #f59e0b; }

    .page { display: none; flex: 1; flex-direction: column; overflow: hidden; }
    .page.active { display: flex; }

    .profile-card {
      padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; overflow-y: auto;
    }
    .avatar-preview {
      width: 90px; height: 90px; border-radius: 50%; object-fit: cover;
      background: #1f6beb; border: 3px solid #f59e0b; display: flex;
      align-items: center; justify-content: center; font-size: 36px; color: #fff; overflow: hidden;
    }
    .input-field {
      width: 100%; max-width: 320px; padding: 10px 14px; background: #161b22;
      border: 1px solid #30363d; border-radius: 8px; color: #fff; font-size: 14px; outline: none;
    }
    .uid-box {
      background: #161b22; border: 1px solid #30363d; padding: 10px 14px;
      border-radius: 8px; font-family: monospace; color: #f59e0b; width: 100%; max-width: 320px; text-align: center;
    }

    #chat-list { flex: 1; overflow-y: auto; }
    .chat-item {
      padding: 12px 16px; border-bottom: 1px solid #21262d; display: flex; align-items: center;
      gap: 12px; cursor: pointer;
    }
    .chat-item:hover { background: #161b22; }
    .chat-avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: #21262d; display: flex; align-items: center; justify-content: center; font-weight: bold; overflow: hidden; flex-shrink: 0; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #6e7681; display: inline-block; margin-right: 6px; }
    .status-dot.online { background: #22c55e; }

    #messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }

    .msg {
      max-width: 80%; padding: 8px 12px; border-radius: 12px; font-size: 14px; word-break: break-word;
      display: flex; flex-direction: column; position: relative;
    }
    .msg.mine { align-self: flex-end; background: #27272a; border: 1px solid #3f3f46; color: #fff; }
    .msg.other { align-self: flex-start; background: #1e293b; border: 1px solid #334155; color: #f8fafc; }
    .msg-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 11px; color: #f59e0b; font-weight: bold; margin-bottom: 4px; }
    .msg-time { font-size: 10px; color: #8b949e; font-weight: normal; }
    .delete-btn { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 12px; padding: 0; }

    .tg-circle {
      width: 160px; height: 160px; border-radius: 50%; object-fit: cover;
      border: 3px solid #f59e0b; cursor: pointer; transition: transform 0.2s;
    }

    #controls { background: #161b22; padding: 8px; border-top: 1px solid #30363d; }
    .input-row { display: flex; align-items: center; gap: 6px; }
    #input { flex: 1; padding: 10px 14px; border: 1px solid #30363d; border-radius: 20px; background: #0d1117; color: #fff; font-size: 14px; outline: none; }
    .btn-icon { background: #21262d; border: 1px solid #30363d; color: #fff; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; flex-shrink: 0; }
    .btn-send { background: #f59e0b; border: none; color: #000; font-weight: bold; }

    /* Окно Звонка */
    #call-modal {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #0d1117;
      flex-direction: column; align-items: center; justify-content: space-between; padding: 20px 10px; z-index: 1000;
    }
    .video-container { position: relative; width: 100%; max-width: 450px; flex: 1; background: #161b22; border-radius: 16px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    #remote-video { width: 100%; height: 100%; object-fit: cover; }
    #local-video { position: absolute; bottom: 12px; right: 12px; width: 100px; height: 140px; border-radius: 10px; object-fit: cover; border: 2px solid #f59e0b; background: #000; }
    
    .call-controls { display: flex; gap: 8px; margin-top: 15px; flex-wrap: wrap; justify-content: center; }
    .call-btn { background: #22c55e; border: none; color: white; padding: 10px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 13px; }
    .call-btn.off { background: #6e7681; }
    .call-btn.danger { background: #ef4444; }
  </style>
</head>
<body>

  <div id="app">
    <header>
      <div class="brand">
        <span>✨</span>
        <h1>ХРАМ</h1>
      </div>
      <button class="btn-icon" id="sync-sim-btn" title="Импорт контактов с SIM / устройства">📱+</button>
    </header>

    <div class="nav-tabs">
      <button class="tab-btn active" id="tab-btn-chats">Чаты</button>
      <button class="tab-btn" id="tab-btn-profile">Профиль</button>
      <button class="tab-btn" id="tab-btn-settings">Настройки</button>
    </div>

    <!-- Чаты -->
    <div id="chats-page" class="page active">
      <div id="chat-list">
        <div class="chat-item" id="bot-chat-item">
          <div class="chat-avatar">🤖</div>
          <div>
            <strong>ИИ Помощник 🤖</strong>
            <div style="font-size:12px; color:#8b949e;">Помощник чата</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Профиль -->
    <div id="profile-page" class="page">
      <div class="profile-card">
        <div id="avatar-display" class="avatar-preview">👤</div>
        <label style="color:#f59e0b; cursor:pointer; font-size:13px;">
          Загрузить аватарку
          <input type="file" id="avatar-input" accept="image/*" style="display:none;">
        </label>

        <div style="width:100%; max-width:320px;">
          <label style="font-size:12px; color:#8b949e;">Ваше имя / Ник:</label>
          <input id="username-input" class="input-field" placeholder="Введите имя..." />
        </div>

        <div style="width:100%; max-width:320px;">
          <label style="font-size:12px; color:#8b949e;">Ваш номер телефона (для поиска друзьям):</label>
          <input id="phone-input" class="input-field" placeholder="+7 999 000 00 00" />
        </div>

        <button class="call-btn" id="save-profile-btn" style="width:100%; max-width:320px; justify-content:center;">Сохранить профиль</button>

        <div style="font-size: 13px; color: #8b949e; margin-top:10px;">ВАШ UID:</div>
        <div class="uid-box" id="my-uid">Загрузка...</div>
      </div>
    </div>

    <!-- Настройки -->
    <div id="settings-page" class="page">
      <div class="profile-card">
        <h3>🎵 Рингтон звонков</h3>
        <input type="file" id="ringtone-input" accept="audio/*" class="input-field">
        <div id="ringtone-status" style="font-size:12px; color:#22c55e;"></div>
      </div>
    </div>

    <!-- Чат -->
    <div id="chat-window-modal" class="page">
      <div id="chat-header" style="background:#161b22; padding:8px 16px; border-bottom:1px solid #30363d; display:flex; justify-content:space-between; align-items:center;">
        <button class="btn-icon" id="close-chat-btn">←</button>
        <div style="display:flex; align-items:center; gap:10px;">
          <div id="active-chat-avatar" class="chat-avatar" style="width:36px; height:36px;">👤</div>
          <div>
            <strong id="active-chat-title">Чат</strong>
            <div id="active-chat-status" style="font-size:11px; color:#8b949e;">⚪ Офлайн</div>
          </div>
        </div>
        <button class="call-btn" id="start-call-btn">📞 Звонок</button>
      </div>

      <div id="messages"></div>

      <div id="controls">
        <div class="input-row">
          <label class="btn-icon">📎<input type="file" id="file-input" style="display:none;"></label>
          <input id="input" autocomplete="off" placeholder="Сообщение..." />
          <button class="btn-icon btn-send" id="send-btn">➔</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Звонок -->
  <div id="call-modal">
    <div id="call-user-info" style="color:#fff; font-size:18px; font-weight:bold; margin-bottom:10px; display:flex; align-items:center; gap:10px;">
      <div id="call-avatar" class="chat-avatar" style="width:40px; height:40px;">👤</div>
      <span id="call-username">Звонок...</span>
    </div>

    <div class="video-container">
      <video id="remote-video" autoplay playsinline></video>
      <video id="local-video" autoplay playsinline muted></video>
    </div>

    <div class="call-controls">
      <button id="toggle-mic-btn" class="call-btn">🎙 Микрофон</button>
      <button id="toggle-cam-btn" class="call-btn">📷 Камера</button>
      <button id="switch-cam-btn" class="call-btn">🔄 Камера</button>
      <button id="accept-call-btn" class="call-btn" style="display:none;">Ответить</button>
      <button id="end-call-btn" class="call-btn danger">Завершить</button>
    </div>
  </div>

  <audio id="custom-ringtone" loop></audio>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    let myProfile = {
      uid: localStorage.getItem('khram_uid') || ('khram-user-' + Math.random().toString(36).substring(2, 8)),
      username: localStorage.getItem('khram_username') || 'Путник',
      avatar: localStorage.getItem('khram_avatar') || '',
      phone: localStorage.getItem('khram_phone') || ''
    };
    localStorage.setItem('khram_uid', myProfile.uid);

    document.getElementById('my-uid').textContent = myProfile.uid;
    document.getElementById('username-input').value = myProfile.username;
    document.getElementById('phone-input').value = myProfile.phone;
    
    function updateMyAvatarDisplay() {
      if (myProfile.avatar) {
        document.getElementById('avatar-display').innerHTML = `<img src="${myProfile.avatar}" style="width:100%;height:100%;object-fit:cover;">`;
      }
    }
    updateMyAvatarDisplay();

    socket.on('connect', () => {
      socket.emit('register', myProfile);
    });

    function saveProfile() {
      myProfile.username = document.getElementById('username-input').value.trim() || 'Путник';
      myProfile.phone = document.getElementById('phone-input').value.trim().replace(/\D/g, '');
      localStorage.setItem('khram_username', myProfile.username);
      localStorage.setItem('khram_phone', myProfile.phone);
      socket.emit('register', myProfile);
      alert('Профиль сохранен!');
    }
    document.getElementById('save-profile-btn').addEventListener('click', saveProfile);

    document.getElementById('avatar-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          myProfile.avatar = evt.target.result;
          localStorage.setItem('khram_avatar', myProfile.avatar);
          updateMyAvatarDisplay();
          socket.emit('register', myProfile);
        };
        reader.readAsDataURL(file);
      }
    });

    // Переключение вкладок
    function switchTab(pageId, targetBtn) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
      if (targetBtn) targetBtn.classList.add('active');
    }

    document.getElementById('tab-btn-chats').addEventListener('click', (e) => switchTab('chats-page', e.target));
    document.getElementById('tab-btn-profile').addEventListener('click', (e) => switchTab('profile-page', e.target));
    document.getElementById('tab-btn-settings').addEventListener('click', (e) => switchTab('settings-page', e.target));

    // Настройка рингтона
    const ringtoneAudio = document.getElementById('custom-ringtone');
    document.getElementById('ringtone-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          localStorage.setItem('khram_ringtone', evt.target.result);
          ringtoneAudio.src = evt.target.result;
          document.getElementById('ringtone-status').textContent = ' Рингтон сохранен!';
        };
        reader.readAsDataURL(file);
      }
    });
    if (localStorage.getItem('khram_ringtone')) {
      ringtoneAudio.src = localStorage.getItem('khram_ringtone');
    }

    // Контакты
    let contacts = JSON.parse(localStorage.getItem('khram_contacts') || '[]');
    let activeOnlineUids = [];

    function renderContacts() {
      const chatList = document.getElementById('chat-list');
      chatList.querySelectorAll('.dynamic-contact').forEach(el => el.remove());

      contacts.forEach(c => {
        const isOnline = activeOnlineUids.includes(c.uid);
        const div = document.createElement('div');
        div.className = 'chat-item dynamic-contact';
        div.addEventListener('click', () => openChat(c.uid, c.name, c.avatar));
        div.innerHTML = `
          <div class="chat-avatar">${c.avatar ? `<img src="${c.avatar}" style="width:100%;height:100%;object-fit:cover;">` : '👤'}</div>
          <div>
            <strong>${c.name}</strong>
            <div style="font-size:12px; color:#8b949e;">
              <span class="status-dot ${isOnline ? 'online' : ''}"></span>${isOnline ? 'Онлайн' : 'Офлайн'}
            </div>
          </div>
        `;
        chatList.appendChild(div);
      });
    }

    document.getElementById('bot-chat-item').addEventListener('click', () => openChat('bot-assistant', 'ИИ Помощник 🤖', ''));

    socket.on('user-profile-updated', (updatedUser) => {
      let changed = false;
      contacts.forEach(c => {
        if (c.uid === updatedUser.uid) {
          c.name = updatedUser.username || c.name;
          c.avatar = updatedUser.avatar || c.avatar;
          changed = true;
        }
      });
      if (changed) {
        localStorage.setItem('khram_contacts', JSON.stringify(contacts));
        renderContacts();
        if (currentChatUid === updatedUser.uid) {
          document.getElementById('active-chat-title').textContent = updatedUser.username;
          if (updatedUser.avatar) {
            document.getElementById('active-chat-avatar').innerHTML = `<img src="${updatedUser.avatar}" style="width:100%;height:100%;object-fit:cover;">`;
          }
        }
      }
    });

    socket.on('online-users-list', (uids) => {
      activeOnlineUids = uids;
      renderContacts();
      updateActiveChatStatus();
    });

    // Синхронизация контактов SIM
    document.getElementById('sync-sim-btn').addEventListener('click', async () => {
      let phoneNumbers = [];
      if ('contacts' in navigator && 'ContactsManager' in window) {
        try {
          const props = ['tel'];
          const selectContacts = await navigator.contacts.select(props, { multiple: true });
          selectContacts.forEach(c => { if (c.tel) phoneNumbers.push(...c.tel); });
        } catch(e) {}
      }

      if (phoneNumbers.length === 0) {
        const input = prompt('Введите номера телефонов с SIM через запятую:', '+79991112233, +79992223344');
        if (input) {
          phoneNumbers = input.split(',');
        }
      }

      if (phoneNumbers.length > 0) {
        socket.emit('sync-contacts', phoneNumbers);
      }
    });

    socket.on('contacts-synced', (foundContacts) => {
      if (!foundContacts || foundContacts.length === 0) {
        alert('Зарегистрированных пользователей среди этих номеров не найдено.');
        return;
      }

      let addedCount = 0;
      foundContacts.forEach(fc => {
        if (fc.uid !== myProfile.uid && !contacts.some(c => c.uid === fc.uid)) {
          contacts.push({ uid: fc.uid, name: fc.name, avatar: fc.avatar });
          addedCount++;
        }
      });

      localStorage.setItem('khram_contacts', JSON.stringify(contacts));
      renderContacts();
      alert(`Добавлено новых контактов: ${addedCount}`);
    });

    let currentChatUid = '';
    function openChat(uid, title, avatar) {
      currentChatUid = uid;
      document.getElementById('active-chat-title').textContent = title;
      const avatarContainer = document.getElementById('active-chat-avatar');
      avatarContainer.innerHTML = avatar ? `<img src="${avatar}" style="width:100%;height:100%;object-fit:cover;">` : '👤';

      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('chat-window-modal').classList.add('active');
      updateActiveChatStatus();
      loadHistory();
    }

    function closeChat() {
      document.getElementById('chat-window-modal').classList.remove('active');
      document.getElementById('chats-page').classList.add('active');
      currentChatUid = '';
    }
    document.getElementById('close-chat-btn').addEventListener('click', closeChat);

    function updateActiveChatStatus() {
      if (!currentChatUid) return;
      const statusEl = document.getElementById('active-chat-status');
      if (currentChatUid === 'bot-assistant') {
        statusEl.textContent = '🟢 Онлайн';
        statusEl.style.color = '#22c55e';
      } else {
        const isOnline = activeOnlineUids.includes(currentChatUid);
        statusEl.textContent = isOnline ? '🟢 Онлайн' : '⚪ Офлайн';
        statusEl.style.color = isOnline ? '#22c55e' : '#8b949e';
      }
    }

    function getHistoryKey(uid) {
      return `chat_history_${myProfile.uid}_${uid}`;
    }

    function loadHistory() {
      const messagesDiv = document.getElementById('messages');
      messagesDiv.innerHTML = '';
      const saved = JSON.parse(localStorage.getItem(getHistoryKey(currentChatUid)) || '[]');
      saved.forEach(msg => renderMessageUI(msg));
    }

    function saveMessageToHistory(msg) {
      const chatKey = (msg.senderUid === myProfile.uid) ? msg.targetUid : msg.senderUid;
      const key = getHistoryKey(chatKey);
      const saved = JSON.parse(localStorage.getItem(key) || '[]');
      if (!saved.some(m => m.id === msg.id)) {
        saved.push(msg);
        localStorage.setItem(key, JSON.stringify(saved));
      }
    }

    const messagesDiv = document.getElementById('messages');
    function renderMessageUI(data) {
      if (document.getElementById(`msg-${data.id}`)) return;

      const isMine = data.senderUid === myProfile.uid;
      const div = document.createElement('div');
      div.className = `msg ${isMine ? 'mine' : 'other'}`;
      div.id = `msg-${data.id}`;

      const header = document.createElement('div');
      header.className = 'msg-header';
      header.innerHTML = `
        <span>${isMine ? 'Вы' : data.senderName} <span class="msg-time">${data.timestamp || ''}</span></span>
        ${isMine ? `<button class="delete-btn" onclick="deleteMessage(${data.id})">🗑️</button>` : ''}
      `;
      div.appendChild(header);

      if (data.type === 'text') {
        const p = document.createElement('div'); p.textContent = data.content; div.appendChild(p);
      } else if (data.type === 'image') {
        const img = document.createElement('img'); img.src = data.content; img.style.maxWidth = '100%'; img.style.borderRadius = '8px'; div.appendChild(img);
      } else if (data.type === 'file') {
        const a = document.createElement('a'); a.href = data.content; a.download = data.fileName || 'file'; a.style.color = '#f59e0b'; a.textContent = `📁 ${data.fileName}`; div.appendChild(a);
      }

      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    socket.on('chat message', (data) => {
      saveMessageToHistory(data);
      if (currentChatUid && (data.senderUid === currentChatUid || data.targetUid === currentChatUid)) {
        renderMessageUI(data);
      }
    });

    function deleteMessage(msgId) {
      socket.emit('delete message', { msgId, senderUid: myProfile.uid, targetUid: currentChatUid });
    }

    socket.on('message deleted', (data) => {
      const el = document.getElementById(`msg-${data.msgId}`);
      if (el) el.remove();
      const key = getHistoryKey(currentChatUid);
      let saved = JSON.parse(localStorage.getItem(key) || '[]');
      saved = saved.filter(m => m.id !== data.msgId);
      localStorage.setItem(key, JSON.stringify(saved));
    });

    const input = document.getElementById('input');
    function sendText() {
      const text = input.value.trim();
      if (text && currentChatUid) {
        socket.emit('chat message', { senderUid: myProfile.uid, targetUid: currentChatUid, type: 'text', content: text });
        input.value = '';
      }
    }
    document.getElementById('send-btn').addEventListener('click', sendText);
    input.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendText(); });

    // WebRTC Звонки
    let peerConnection, localStream;
    let isMicEnabled = true, isCamEnabled = true, currentFacingMode = 'user';
    const callModal = document.getElementById('call-modal');
    const remoteVideo = document.getElementById('remote-video');
    const localVideo = document.getElementById('local-video');
    const acceptCallBtn = document.getElementById('accept-call-btn');
    let callTargetSocketId = null;

    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    };

    async function setupCallMedia(facingMode = 'user') {
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
      }
      localStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: facingMode },
        audio: true
      });
      localVideo.srcObject = localStream;

      if (peerConnection) {
        const videoTrack = localStream.getVideoTracks()[0];
        const sender = peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
        if (sender && videoTrack) {
          sender.replaceTrack(videoTrack);
        }
      }
    }

    document.getElementById('toggle-mic-btn').addEventListener('click', (e) => {
      if (localStream) {
        isMicEnabled = !isMicEnabled;
        localStream.getAudioTracks().forEach(t => t.enabled = isMicEnabled);
        e.target.classList.toggle('off', !isMicEnabled);
      }
    });

    document.getElementById('toggle-cam-btn').addEventListener('click', (e) => {
      if (localStream) {
        isCamEnabled = !isCamEnabled;
        localStream.getVideoTracks().forEach(t => t.enabled = isCamEnabled);
        e.target.classList.toggle('off', !isCamEnabled);
      }
    });

    document.getElementById('switch-cam-btn').addEventListener('click', async () => {
      currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
      await setupCallMedia(currentFacingMode);
    });

    document.getElementById('start-call-btn').addEventListener('click', async () => {
      if (!currentChatUid) return;
      const contact = contacts.find(c => c.uid === currentChatUid);
      document.getElementById('call-username').textContent = contact ? contact.name : 'Звонок...';
      document.getElementById('call-avatar').innerHTML = (contact && contact.avatar) ? `<img src="${contact.avatar}" style="width:100%;height:100%;object-fit:cover;">` : '👤';

      callModal.style.display = 'flex';
      await setupCallMedia(currentFacingMode);

      peerConnection = new RTCPeerConnection(rtcConfig);
      localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));

      peerConnection.ontrack = e => { if (e.streams && e.streams[0]) remoteVideo.srcObject = e.streams[0]; };
      peerConnection.onicecandidate = e => { if (e.candidate) socket.emit('ice-candidate', { targetUid: currentChatUid, candidate: e.candidate }); };

      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);
      socket.emit('call-user', { targetUid: currentChatUid, senderUid: myProfile.uid, offer });
    });

    socket.on('incoming-call', async (data) => {
      callTargetSocketId = data.fromSocketId;
      document.getElementById('call-username').textContent = data.fromName || 'Входящий звонок';
      document.getElementById('call-avatar').innerHTML = data.fromAvatar ? `<img src="${data.fromAvatar}" style="width:100%;height:100%;object-fit:cover;">` : '👤';

      callModal.style.display = 'flex';
      acceptCallBtn.style.display = 'flex';

      if (ringtoneAudio.src) ringtoneAudio.play().catch(e=>{});
      window.incomingOffer = data.offer;
    });

    acceptCallBtn.addEventListener('click', async () => {
      ringtoneAudio.pause();
      acceptCallBtn.style.display = 'none';
      await setupCallMedia(currentFacingMode);

      peerConnection = new RTCPeerConnection(rtcConfig);
      localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));

      peerConnection.ontrack = e => { if (e.streams && e.streams[0]) remoteVideo.srcObject = e.streams[0]; };
      peerConnection.onicecandidate = e => { if (e.candidate) socket.emit('ice-candidate', { toSocketId: callTargetSocketId, candidate: e.candidate }); };

      await peerConnection.setRemoteDescription(new RTCSessionDescription(window.incomingOffer));
      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);

      socket.emit('make-answer', { toSocketId: callTargetSocketId, answer });
    });

    socket.on('call-answered', async (data) => {
      if (peerConnection) {
        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
      }
    });

    socket.on('ice-candidate', async (data) => {
      if (peerConnection && data.candidate) {
        try { await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate)); } catch(e){}
      }
    });

    function closeCall() {
      ringtoneAudio.pause();
      if (peerConnection) { peerConnection.close(); peerConnection = null; }
      if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
      remoteVideo.srcObject = null;
      localVideo.srcObject = null;
      callModal.style.display = 'none';
      acceptCallBtn.style.display = 'none';
    }

    document.getElementById('end-call-btn').addEventListener('click', () => {
      socket.emit('end-call', { targetUid: currentChatUid });
      closeCall();
    });

    socket.on('call-ended', closeCall);

    renderContacts();
  </script>
</body>
  </html>
