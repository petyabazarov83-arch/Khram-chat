В нём исправлены все проблемы:
1. **Голосовые сообщения и Кружочки** переведены на `MediaRecorder` (без вызова браузерных `confirm` / `alert`).
2. **Файлы и Фото** отправляются прямо через WebSocket как данные Base64.
3. **Кнопки в звонке**: реализована мутация треков (отключение/включение микрофона и видео), а также динамическая замена видеопотока при переключении передней/задней камеры (`facingMode`).
4. **Уведомления**: добавлена интеграция Web Notifications API и обработка фонового сервиса (`Service Worker`), чтобы сообщения и звонки приходли, когда вкладка свернута.

### 1. Серверная часть: `server.js` (Node.js + Express + Socket.IO)

```javascript
const express = require('express');
const http = require('http');
const { Server } = require('socket.io');
const path = require('path');

const app = express();
const server = http.createServer(app);
const io = new Server(server, {
    maxHttpBufferSize: 1e8 // Лимит 100MB для отправки медиафайлов
});

app.use(express.static(path.join(__dirname, 'public')));

io.on('connection', (socket) => {
    console.log('Пользователь подключился:', socket.id);

    // Пересылка обычных сообщений, фото, файлов, аудио и кружочков
    socket.on('sendMessage', (data) => {
        // data: { type: 'text'|'image'|'file'|'audio'|'circle', content: ..., name: ... }
        io.emit('newMessage', {
            sender: socket.id,
            ...data
        });
    });

    // WebRTC Сигнализация для звонков
    socket.on('callUser', (data) => {
        socket.broadcast.emit('incomingCall', {
            from: socket.id,
            offer: data.offer
        });
    });

    socket.on('answerCall', (data) => {
        io.to(data.to).emit('callAccepted', data.signal);
    });

    socket.on('iceCandidate', (data) => {
        socket.broadcast.emit('iceCandidate', data);
    });

    socket.on('endCall', () => {
        socket.broadcast.emit('callEnded');
    });

    socket.on('disconnect', () => {
        console.log('Пользователь отключился:', socket.id);
    });
});

const PORT = process.env.PORT || 3000;
server.listen(PORT, () => console.log(`Сервер запущен на порту ${PORT}`));
