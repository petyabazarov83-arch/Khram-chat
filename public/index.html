<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Храм</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: #1e1e1e;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2a2a2a;
    }
    header h1 { margin: 0; font-size: 18px; color: #a855f7; }
    .call-btn {
      background: #22c55e;
      border: none;
      color: white;
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      background: #1e1e1e;
      padding: 10px 14px;
      border-radius: 14px;
      max-width: 80%;
      word-break: break-word;
    }
    .message img {
      max-width: 100%;
      border-radius: 10px;
      margin-top: 5px;
    }
    .message audio {
      width: 100%;
      max-width: 250px;
      margin-top: 5px;
    }
    .circle-video {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #a855f7;
    }
    #controls {
      background: #181818;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .input-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #input {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 20px;
      background: #2a2a2a;
      color: #fff;
      font-size: 15px;
      outline: none;
    }
    .btn-icon {
      background: #2a2a2a;
      border: none;
      color: white;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
    }
    .btn-send {
      background: #a855f7;
    }
    .recording {
      background: #ef4444 !important;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    #call-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.9);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    #remote-video {
      width: 100%;
      max-width: 400px;
      height: 300px;
      background: #000;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Храм</h1>
    <button class="call-btn" id="start-call-btn">📞 Звонок</button>
  </header>

  <div id="chat"></div>

  <div id="controls">
    <div class="input-row">
      <label class="btn-icon">
        📷
        <input type="file" id="file-input" accept="image/*" style="display:none;">
      </label>
      <button class="btn-icon" id="mic-btn">🎙</button>
      <button class="btn-icon" id="circle-btn">⭕</button>
      <input id="input" autocomplete="off" placeholder="Сообщение..." />
      <button class="btn-icon btn-send" id="send-btn">➔</button>
    </div>
  </div>

  <!-- Модальное окно для звонков -->
  <div id="call-modal">
    <video id="remote-video" autoplay playsinline></video>
    <div style="margin-top: 20px; display: flex; gap: 15px;">
      <button id="accept-call-btn" class="call-btn" style="display:none;">Ответить</button>
      <button id="end-call-btn" class="call-btn" style="background:#ef4444;">Завершить</button>
    </div>
  </div>

  <!-- Подключаем клиент Socket.io из Express сервера -->
  <script src="/socket.io/socket.io.js"></script>

  <!-- Код логики чата и WebRTC звонков -->
  <script>
    const socket = io();

    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send-btn');
    const fileInput = document.getElementById('file-input');
    const micBtn = document.getElementById('mic-btn');
    const circleBtn = document.getElementById('circle-btn');

    // Функция отрисовки сообщений
    function addMessage(data) {
      const div = document.createElement('div');
      div.className = 'message';

      if (data.type === 'text') {
        div.textContent = data.content;
      } else if (data.type === 'image') {
        const img = document.createElement('img');
        img.src = data.content;
        div.appendChild(img);
      } else if (data.type === 'audio') {
        const audio = document.createElement('audio');
        audio.src = data.content;
        audio.controls = true;
        div.appendChild(audio);
      } else if (data.type === 'circle') {
        const video = document.createElement('video');
        video.src = data.content;
        video.className = 'circle-video';
        video.autoplay = true;
        video.loop = true;
        video.muted = true;
        video.playsInline = true;
        div.appendChild(video);
      }

      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    // Приём новых сообщений
    socket.on('chat message', (data) => {
      addMessage(data);
    });

    // Отправка текста
    function sendText() {
      const text = input.value.trim();
      if (text) {
        socket.emit('chat message', { type: 'text', content: text });
        input.value = '';
      }
    }

    sendBtn.addEventListener('click', sendText);
    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendText();
    });

    // Отправка картинки
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          socket.emit('chat message', { type: 'image', content: event.target.result });
        };
        reader.readAsDataURL(file);
      }
    });

    // Запись голосовых сообщений
    let audioRecorder, audioChunks = [];
    micBtn.addEventListener('click', async () => {
      if (!audioRecorder || audioRecorder.state === 'inactive') {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioRecorder = new MediaRecorder(stream);
        audioChunks = [];
        audioRecorder.ondataavailable = (e) => audioChunks.push(e.data);
        audioRecorder.onstop = () => {
          const blob = new Blob(audioChunks, { type: 'audio/webm' });
          const reader = new FileReader();
          reader.onload = (e) => socket.emit('chat message', { type: 'audio', content: e.target.result });
          reader.readAsDataURL(blob);
          stream.getTracks().forEach(t => t.stop());
        };
        audioRecorder.start();
        micBtn.classList.add('recording');
      } else {
        audioRecorder.stop();
        micBtn.classList.remove('recording');
      }
    });

    // Запись видеосообщений (кружочков)
    let circleRecorder, circleChunks = [];
    circleBtn.addEventListener('click', async () => {
      if (!circleRecorder || circleRecorder.state === 'inactive') {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 300, height: 300 }, audio: true });
        circleRecorder = new MediaRecorder(stream);
        circleChunks = [];
        circleRecorder.ondataavailable = (e) => circleChunks.push(e.data);
        circleRecorder.onstop = () => {
          const blob = new Blob(circleChunks, { type: 'video/webm' });
          const reader = new FileReader();
          reader.onload = (e) => socket.emit('chat message', { type: 'circle', content: e.target.result });
          reader.readAsDataURL(blob);
          stream.getTracks().forEach(t => t.stop());
        };
        circleRecorder.start();
        circleBtn.classList.add('recording');
      } else {
        circleRecorder.stop();
        circleBtn.classList.remove('recording');
      }
    });

    // Звонки (WebRTC)
    let peerConnection, localStream;
    const callModal = document.getElementById('call-modal');
    const remoteVideo = document.getElementById('remote-video');
    const startCallBtn = document.getElementById('start-call-btn');
    const acceptCallBtn = document.getElementById('accept-call-btn');
    const endCallBtn = document.getElementById('end-call-btn');
    let incomingOffer, callerId;

    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    async function setupMedia() {
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    }

    startCallBtn.addEventListener('click', async () => {
      callModal.style.display = 'flex';
      await setupMedia();
      peerConnection = new RTCPeerConnection(rtcConfig);
      localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));

      peerConnection.ontrack = (e) => { remoteVideo.srcObject = e.streams[0]; };
      peerConnection.onicecandidate = (e) => {
        if (e.candidate) socket.emit('ice-candidate', e.candidate);
      };

      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);
      socket.emit('call-user', { offer });
    });

    socket.on('incoming-call', (data) => {
      incomingOffer = data.offer;
      callerId = data.from;
      callModal.style.display = 'flex';
      acceptCallBtn.style.display = 'block';
    });

    acceptCallBtn.addEventListener('click', async () => {
      acceptCallBtn.style.display = 'none';
      await setupMedia();
      peerConnection = new RTCPeerConnection(rtcConfig);
      localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));

      peerConnection.ontrack = (e) => { remoteVideo.srcObject = e.streams[0]; };
      peerConnection.onicecandidate = (e) => {
        if (e.candidate) socket.emit('ice-candidate', { to: callerId, candidate: e.candidate });
      };

      await peerConnection.setRemoteDescription(new RTCSessionDescription(incomingOffer));
      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);
      socket.emit('make-answer', { to: callerId, answer });
    });

    socket.on('call-answered', async (data) => {
      await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
    });

    socket.on('ice-candidate', async (candidate) => {
      if (peerConnection) await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
    });

    function closeCall() {
      if (peerConnection) peerConnection.close();
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      callModal.style.display = 'none';
      acceptCallBtn.style.display = 'none';
    }

    endCallBtn.addEventListener('click', () => {
      socket.emit('end-call');
      closeCall();
    });

    socket.on('call-ended', closeCall);
  </script>
</body>
        </html>
