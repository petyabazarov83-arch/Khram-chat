<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Khram Messenger</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0f0f10; color: #fff; display: flex; flex-direction: column; height: 100vh; }
        
        /* Шапка */
        header { background: #18181c; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #28282e; }
        header h1 { font-size: 18px; color: #3b82f6; }
        .call-btn-head { background: #10b981; border: none; padding: 8px 14px; border-radius: 20px; color: white; font-weight: bold; cursor: pointer; }
        
        /* Окно чата */
        #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg-row { display: flex; flex-direction: column; max-width: 80%; background: #1e1e24; padding: 10px 14px; border-radius: 14px; word-break: break-word; }
        .msg-row.my { align-self: flex-end; background: #2563eb; }
        .msg-row img { max-width: 100%; border-radius: 8px; margin-top: 5px; }
        
        /* Кружочки */
        .circle-video { width: 180px; height: 180px; border-radius: 50%; object-fit: cover; border: 3px solid #3b82f6; }

        /* Зона звонка */
        #call-section { display: none; background: #141417; padding: 15px; flex-direction: column; align-items: center; gap: 10px; border-bottom: 1px solid #28282e; }
        .video-grid { display: flex; gap: 10px; width: 100%; justify-content: center; }
        video.stream-box { width: 45%; max-height: 200px; background: #000; border-radius: 12px; object-fit: cover; }
        .call-controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 5px; }

        /* Кнопки и Панель ввода */
        .panel { background: #18181c; padding: 10px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #28282e; }
        .input-row { display: flex; gap: 8px; }
        input[type="text"] { flex: 1; background: #28282e; border: none; padding: 12px 16px; border-radius: 20px; color: white; font-size: 15px; outline: none; }
        
        button { border: none; border-radius: 20px; padding: 10px 14px; background: #28282e; color: white; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 5px; }
        button.primary { background: #3b82f6; }
        button.danger { background: #ef4444; }
        button.recording { background: #ef4444; animation: pulse 1s infinite; }

        .media-actions { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
        
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <header>
        <h1>Khram Messenger</h1>
        <button class="call-btn-head" onclick="toggleCallPanel()">📞 Звонок</button>
    </header>

    <!-- Панель видеозвонка -->
    <div id="call-section">
        <div class="video-grid">
            <video id="local-video" autoplay playsinline muted class="stream-box"></video>
            <video id="remote-video" autoplay playsinline class="stream-box"></video>
        </div>
        <div class="call-controls">
            <button class="primary" onclick="startCall()">📞 Позвонить</button>
            <button id="mic-btn" onclick="toggleMic()">🎙️ Мик: Вкл</button>
            <button id="cam-btn" onclick="toggleCam()">📹 Камера: Вкл</button>
            <button onclick="switchCamera()">🔄 Камера</button>
            <button class="danger" onclick="endCall()">❌ Сбросить</button>
        </div>
    </div>

    <!-- Чат -->
    <div id="chat-container"></div>

    <!-- Панель отправки -->
    <div class="panel">
        <div class="media-actions">
            <input type="file" id="file-input" style="display: none;" onchange="sendFile(this)">
            <button onclick="document.getElementById('file-input').click()">📁 Файл/Фото</button>
            <button id="rec-audio-btn" onclick="toggleAudioRecord()">🎙️ ГС</button>
            <button id="rec-circle-btn" onclick="toggleCircleRecord()">⭕ Кружочек</button>
        </div>
        <div class="input-row">
            <input type="text" id="message-input" placeholder="Сообщение..." onkeypress="if(event.key==='Enter') sendTextMessage()">
            <button class="primary" onclick="sendTextMessage()">Отправить</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
